/* md-preview: VSCodium / VS Code "Light Modern" markdown-preview look.
   This block is injected last into the page head via pandoc --include-in-header,
   so it overrides pandoc's default-template body styling.
   Structure: (1) theme variables, (2) base overrides, (3) inline-code chip,
   (4) verbatim upstream VS Code markdown.css, (5) unscoped light border colors,
   (10) the dark-appearance token flip.
   Upstream provenance + refresh command: assets/REFRESH.md */

/* (1) Concrete light-theme values for the variables markdown.css references.
   Every color below is a token because section (10) redefines tokens only.
   Light values are the originals, so the light page is byte-identical. */
:root {
  --markdown-font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", system-ui, "Ubuntu", "Droid Sans", sans-serif;
  --markdown-font-size: 14px;
  --markdown-line-height: 22px;
  --vscode-editor-font-family: "SF Mono", Monaco, Menlo, Consolas, "Ubuntu Mono", "Liberation Mono", "DejaVu Sans Mono", "Courier New", monospace;
  --vscode-editor-foreground: #3b3b3b;
  --vscode-editor-background: #ffffff;
  --vscode-textCodeBlock-background: #f3f3f3;
  --vscode-widget-border: #e5e5e5;

  --mdp-link: #006ab1;                    /* VS Code Light Modern textLink.foreground */
  --mdp-link-underline: rgba(0, 106, 177, 0.35);
  --mdp-code-chip-bg: rgba(0, 0, 0, 0.06);
  --mdp-border: rgba(0, 0, 0, 0.18);      /* h1/h2/hr/td rules */
  --mdp-border-strong: rgba(0, 0, 0, 0.69);
  --mdp-rule: #d8dce1;                    /* table frame + header rule */
  --mdp-rule-soft: #eef0f3;               /* row hairline, frontmatter hairline */
  --mdp-rail: #ececec;                    /* derivation-chain rail */
  --mdp-zebra: #f6f8fa;
  --mdp-quote-rule: #d1d5db;
  --mdp-scrollbar: #d1d5db;
  --mdp-ink-muted: #6e7681;               /* keys, captions, thead labels */
  --mdp-ink-soft: #4b5563;                /* blockquote text */
  --mdp-ink-faint: #8a8a8a;               /* derivation annotation */
  --mdp-ink-strong: #18181b;
  --mdp-marker: #6b7280;                  /* list markers, footnotes */
  --mdp-neg: #b91c1c;
  --mdp-pos: #047857;
  --mdp-callout-note: #0969da;
  --mdp-callout-tip: #1a7f37;
  --mdp-callout-important: #8250df;
  --mdp-callout-warning: #9a6700;
  --mdp-callout-caution: #cf222e;

  /* Pandoc emits the tango syntax palette ABOVE this block, so section (10b)
     restates each tango group through a token and wins on source order. */
  --mdp-syn-alert: #ef2929;
  --mdp-syn-comment: #8f5902;
  --mdp-syn-keyword: #204a87;
  --mdp-syn-number: #0000cf;
  --mdp-syn-string: #4e9a06;
  --mdp-syn-error: #a40000;
  --mdp-syn-operator: #ce5c00;
  --mdp-syn-var: #000000;
}

/* (2) Override pandoc's default template (#fdfdfd bg) + a comfortable reading column.
   This is a deliberate divergence from VS Code's full-width preview: on a wide screen,
   full-width mono lines get too long to read and centered display-math floats far from
   the prose. Capping the body to a reading measure and centering it keeps lines scannable
   and math next to its text. Narrow screens are unaffected (capped by the viewport). */
html { background-color: var(--vscode-editor-background); }
body {
  /* One reading column, capped + centered (re-established 2026-07-12). The 2026-06-11
     removal happened because wide math/code forced page-level scrollbars back then;
     those elements now own their overflow (sections 6, 7, 7b), so the cap is safe.
     Wide blocks may exceed the 48rem prose measure (7b) up to this 60rem page column,
     then scroll inside their own box. body stays content-box, so the sidebar
     padding-left does not eat into the column. */
  max-width: 60rem;
  margin: 0 auto;
  background-color: var(--vscode-editor-background);
  color: var(--vscode-editor-foreground);
}
/* pandoc's default template sets `code { white-space: pre-wrap }`, which makes code
   BLOCKS wrap mid-line (breaking ASCII diagrams) instead of scrolling. VS Code's
   preview scrolls; restore that. Inline code keeps pandoc's wrap. */
pre code { white-space: pre; }
/* Note: no -webkit-font-smoothing override. Grayscale antialiasing made the type too thin;
   the browser's default (subpixel) weight is the desired look. */

/* (3) Inline-code chip. markdown.css styles only block code; in VS Code the
   theme paints inline <code>. Approximate with a subtle GitHub/VS-Code-light chip. */
:not(pre) > code {
  background-color: var(--mdp-code-chip-bg);
  border-radius: 4px;
  padding: 0.12em 0.34em;
}

/* (4) Upstream VS Code markdown.css (verbatim) follows: */

html, body {
	font-family: var(--markdown-font-family, -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", system-ui, "Ubuntu", "Droid Sans", sans-serif);
	font-size: var(--markdown-font-size, 14px);
	padding: 0 26px;
	line-height: var(--markdown-line-height, 22px);
	word-wrap: break-word;
}

body {
	padding-top: 1em;
}

/* Reset margin top for elements */
h1, h2, h3, h4, h5, h6,
p, ol, ul, pre {
	margin-top: 0;
}

h1, h2, h3, h4, h5, h6 {
	font-weight: 600;
	margin-top: 24px;
	margin-bottom: 16px;
	line-height: 1.25;
}

#code-csp-warning {
	position: fixed;
	top: 0;
	right: 0;
	color: white;
	margin: 16px;
	text-align: center;
	font-size: 12px;
	font-family: sans-serif;
	background-color:#444444;
	cursor: pointer;
	padding: 6px;
	box-shadow: 1px 1px 1px rgba(0,0,0,.25);
}

#code-csp-warning:hover {
	text-decoration: none;
	background-color:#007acc;
	box-shadow: 2px 2px 2px rgba(0,0,0,.25);
}

body.scrollBeyondLastLine {
	margin-bottom: calc(100vh - 22px);
}

body.showEditorSelection .code-line {
	position: relative;
}

.code-line-diff {
	border-radius: 2px;
	box-shadow: -4px 0 0 transparent;
}

.code-line-diff-added {
	background-color: var(--vscode-diffEditor-insertedTextBackground);
	box-shadow: -4px 0 0 var(--vscode-diffEditorGutter-insertedLineBackground);
}

.code-line-diff-deleted {
	background-color: var(--vscode-diffEditor-removedTextBackground);
	box-shadow: -4px 0 0 var(--vscode-diffEditorGutter-removedLineBackground);
}

.vscode-high-contrast .code-line-diff-added {
	outline: 1px solid var(--vscode-diffEditor-insertedTextBorder);
}

.vscode-high-contrast .code-line-diff-deleted {
	outline: 1px solid var(--vscode-diffEditor-removedTextBorder);
}

::highlight(diff-inner-added) {
	background-color: var(--vscode-diffEditor-insertedTextBackground);
}

::highlight(diff-inner-deleted) {
	background-color: var(--vscode-diffEditor-removedTextBackground);
}

/* Hide the empty marker spans so they don't affect layout */
[data-diff-start],
[data-diff-end] {
	display: contents;
}

/* Change indicator: shown where lines were deleted or modified */
.diff-change-indicator {
	position: relative;
	height: 4px;
	overflow: visible;
	z-index: 1;
}

/* Single visual element for the entire arrow + bar shape (avoids transparent color overlap) */
.diff-change-indicator::before {
	content: "";
	position: absolute;
	top: -4px;
	left: -12px;
	right: 0;
	height: 12px;
	background-color: var(--vscode-diffEditorGutter-removedLineBackground, var(--vscode-diffEditor-removedTextBackground));
	clip-path: polygon(
		0px 0px,
		4px 4px,
		100% 4px,
		100% 8px,
		4px 8px,
		0px 12px
	);
	pointer-events: none;
}

/* Transparent hover target over the gutter arrow area */
.diff-change-indicator-arrow {
	display: block;
	position: absolute;
	top: -4px;
	left: -12px;
	width: 12px;
	height: 12px;
	cursor: pointer;
	z-index: 2;
}

.diff-change-indicator-arrow:hover > .diff-change-indicator-tooltip,
.diff-change-indicator-arrow > .diff-change-indicator-tooltip:hover {
	display: block;
}

.diff-change-indicator-arrow > .diff-change-indicator-tooltip {
	left: 8px;
	top: 100%;
	right: auto;
	width: max-content;
	max-width: 80vw;
}

/* Modified lines override the left gutter bar color */
.code-line-diff-modified.code-line-diff-added {
	box-shadow: none;
}

/* Modification indicator uses a subtler style placed after the changed block */
.diff-change-indicator-modification {
	height: 2px;
	background: repeating-linear-gradient(
		90deg,
		var(--vscode-diffEditorGutter-removedLineBackground, var(--vscode-diffEditor-removedTextBackground)) 0px,
		var(--vscode-diffEditorGutter-removedLineBackground, var(--vscode-diffEditor-removedTextBackground)) 4px,
		transparent 4px,
		transparent 8px
	);
}

.diff-change-indicator-modification .diff-change-indicator-arrow {
	background: inherit;
}

/* Left gutter bar for modification blocks */
.diff-modification-gutter {
	position: absolute;
	top: 0;
	bottom: 0;
	left: -12px;
	width: 4px;
	z-index: 5;
	background-color: var(--vscode-editorGutter-modifiedBackground, #1b81a8);
	cursor: pointer;
}

.diff-modification-gutter:hover > .diff-change-indicator-tooltip,
.diff-modification-gutter > .diff-change-indicator-tooltip:hover {
	display: block;
}

.diff-modification-gutter > .diff-change-indicator-tooltip {
	left: 4px;
	top: 0;
	right: auto;
	width: max-content;
	max-width: 80vw;
}

.diff-change-indicator-tooltip {
	display: none;
	position: absolute;
	top: 100%;
	left: 0;
	right: 0;
	z-index: 10;
	background-color: var(--vscode-editor-background);
	border: 1px solid var(--vscode-editorWidget-border, var(--vscode-contrastBorder, rgba(127, 127, 127, 0.35)));
	border-radius: 3px;
	max-height: min(400px, 80vh);
	overflow-y: auto;
	overflow-x: hidden;
	overscroll-behavior: contain;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.diff-change-indicator-tooltip pre {
	margin: 0;

	background: transparent;
	border: 0;
	white-space: pre-wrap;
	word-break: break-word;
	color: var(--vscode-editor-foreground);
}

.diff-tooltip-deleted {
	background-color: var(--vscode-diffEditor-removedTextBackground);
	border-left: 4px solid var(--vscode-diffEditorGutter-removedLineBackground, var(--vscode-diffEditor-removedTextBackground));

.diff-tooltip-inner-deleted,

.diff-tooltip-inner-deleted {

.diff-tooltip-inner-added {
	background-color: var(--vscode-diffEditor-insertedTextBackground);
}

body.showEditorSelection :not(tr,ul,ol).code-active-line:before,

/* Frontmatter properties table (table.mdp-frontmatter): a clean, borderless, header-less
   metadata block, no outer box, no accent rail (a box outline + color did not read
   clean). Just key/value pairs separated by a faint hairline. Emitted as raw HTML by
   assets/frontmatter-to-table.py. .frontmatter-error below is kept (a valid future hook). */
table.mdp-frontmatter {
	display: table;                 /* override base `table { display:block }` */
	width: auto;
	max-width: 100%;
	border: none;                   /* no outer box, no left rail */
	border-radius: 0;
	border-collapse: collapse;
	margin: 0 0 24px;               /* = h1 margin-top, matches heading rhythm */
	box-shadow: none;
	overflow: visible;
}
table.mdp-frontmatter col.mdp-fm-col-key { width: 1% !important; }
table.mdp-frontmatter col.mdp-fm-col-val { width: auto !important; }
table.mdp-frontmatter td {
	padding: 6px 14px;
	border: none;
	border-bottom: 1px solid var(--mdp-rule-soft); /* horizontal hairline, content-row tone */
	vertical-align: top;
	text-align: left;
}
table.mdp-frontmatter tr:last-child td { border-bottom: none; }
table.mdp-frontmatter td.mdp-fm-key {
	font-family: var(--vscode-editor-font-family, "SF Mono", Monaco, Menlo, Consolas, monospace);
	font-size: 13px;
	color: var(--mdp-ink-muted);       /* muted: keys recede, values lead */
	white-space: nowrap;
	max-width: 240px;
	overflow-wrap: break-word;
}
table.mdp-frontmatter td.mdp-fm-val {
	color: var(--vscode-editor-foreground);
	word-break: break-word;
	overflow-wrap: anywhere;        /* a 300+ char value wraps freely */
}
table.mdp-frontmatter td.mdp-fm-val code { white-space: normal; } /* let inline code wrap */
table.mdp-frontmatter td.mdp-fm-val .mdp-fm-scalar {
	font-family: var(--vscode-editor-font-family, "SF Mono", Monaco, Menlo, Consolas, monospace);
	color: var(--vscode-editor-foreground); /* typed scalar: mono, no chip */
}

/* Long values (>=160 chars, tagged .mdp-fm-long): open the leading so the wrapped text
   reads as a paragraph; the explicit (1)/(2)/(3) enumeration is broken onto lines by the
   renderer. Short scalar rows are untouched. */
table.mdp-frontmatter td.mdp-fm-val.mdp-fm-long {
	line-height: 1.6;
	hyphens: none;                  /* never hyphenate code/slashes like docs/<topic>/ */
}
/* Clamp a long value to a few lines by default (metadata, not the main content); the foot JS
   adds a "Show more" toggle that sets .mdp-fm-expanded to reveal the rest. */
table.mdp-frontmatter td.mdp-fm-long .mdp-fm-clamp {
	display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5;
	overflow: hidden;
}
table.mdp-frontmatter td.mdp-fm-long.mdp-fm-expanded .mdp-fm-clamp {
	display: block; -webkit-line-clamp: unset; overflow: visible;
}
.mdp-fm-more {
	margin-top: 5px; padding: 0; border: 0; background: none; cursor: pointer;
	font-family: var(--vscode-editor-font-family, "SF Mono", Monaco, Menlo, Consolas, monospace);
	font-size: 12px; color: var(--mdp-ink-muted); /* neutral grey, no accent */
}
.mdp-fm-more:hover { color: var(--mdp-ink-strong); text-decoration: underline; }

/* When the table carries a long value, cap the WHOLE table so the value wraps at a
   comfortable measure (~700px column) instead of a full-width wall, and give it a real
   width so the value column never collapses to a sliver. Short-only frontmatter (no long
   row) keeps the compact width:auto aside. The key column stays narrow via the colgroup. */
table.mdp-frontmatter.mdp-fm-has-long { width: 100%; max-width: 820px; }
table.mdp-frontmatter.mdp-fm-has-long td.mdp-fm-key { vertical-align: top; }

.frontmatter-error {
	margin-bottom: 16px;
	padding: 8px 13px;
	border-left: 4px solid var(--vscode-editorError-foreground, #f48771);
	background: var(--vscode-inputValidation-errorBackground, rgba(244, 135, 113, 0.1));
	color: var(--vscode-editorError-foreground, #f48771);
}

.frontmatter-error pre {
	margin: 6px 0 0;
	white-space: pre-wrap;
	color: inherit;
	background: transparent;
	padding: 0;
}

/* (5) markdown.css scopes border colors under .vscode-light; the standalone
   preview body carries no theme class, so re-assert the light values unscoped. */
h1, h2, hr, td { border-color: var(--mdp-border); }
th { border-color: var(--mdp-border-strong); }
hr { border-bottom-color: var(--mdp-border); }
a { color: var(--mdp-link); }

/* (6) md-preview tables: clean VS Code baseline + one accent (header rule), and
   horizontal scroll for wide tables instead of squashing the reading column.
   Design reviewed by a UX pass: dropped header-fill / hover (data-grid noise on a
   static reading surface); kept the header rule + row hairlines. Zebra was dropped
   there too but reinstated 2026-07-12 (finance tables need the row guide).
   `display:block` + `width:max-content` is the CSS-only way to get overflow-x on a
   bare <table> (pandoc emits no wrapper div): narrow tables size to content, wide
   tables cap at the column width and scroll horizontally. */
/* Pandoc emits <col style="width:33%"> (equal splits) whenever the source pipe-table
   lines exceed its --columns width, so a short keyword column gets as much room as a
   prose column. Size columns by CONTENT instead (important beats the inline style). */
col { width: auto !important; }
table > tbody > tr + tr > td { border-top: none; } /* kill upstream row-top border */
/* Hairline card + editorial header (two-designer consensus pass, "modern + clean"):
   the frame turns the table into one quiet component (shadcn/Notion/Mintlify), which
   lets every INTERNAL line get lighter, not heavier. Header goes small/uppercase/
   tracked/muted (Stripe/Linear): typographic contrast does what the old 2px bar did.
   Cells are uniformly inset (flush-to-margin died with the frame: two geometries at
   once reads as a bug). Still no zebra / header fill / hover / accent: the frame
   delivers the richness those were reaching for. */
table {
  display: block;
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
  border-collapse: separate; /* collapse can void border-radius on table boxes */
  border-spacing: 0;
  border: 1px solid var(--mdp-rule); /* matches the header rule: frame >= strongest internal line */
  border-radius: 6px;
  margin: 0 0 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--mdp-scrollbar) transparent;
}
th, td { padding: 6px 14px; text-align: left; vertical-align: top; border: none; } /* 6px: scan-density for data tables (designer pass 2026-07-12) */
thead th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--mdp-ink-muted);
  white-space: nowrap;
  padding-top: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--mdp-rule);
}
tbody td { border-bottom: 1px solid var(--mdp-rule-soft); }
tbody tr:last-child td { border-bottom: none; } /* the frame closes the bottom */
/* Zebra stripes: data-heavy tables need the row guide. Even rows get a whisper fill; last-row corners stay inside the frame. */
table:not(.mdp-frontmatter) tbody tr:nth-child(even) td { background: var(--mdp-zebra); } /* scoped: frontmatter stays hairline-only */
tbody tr:last-child td:first-child { border-bottom-left-radius: 5px; }
tbody tr:last-child td:last-child { border-bottom-right-radius: 5px; }
td code { white-space: nowrap; } /* backticked keywords never wrap mid-token */
/* Respect markdown right-aligned (numeric) columns: tabular figures + right edge. */
th[style*="right"], td[style*="right"] { text-align: right; font-variant-numeric: tabular-nums; }
/* Numeric columns detected at load time (script after this style block). */
td.mdp-num, th.mdp-num { text-align: right; font-variant-numeric: tabular-nums; }
/* Percent cells carry sign semantics (finance tables): muted red/green, readable on
   both the white row and the zebra fill. Zero stays neutral. */
td.mdp-neg { color: var(--mdp-neg); }
td.mdp-pos { color: var(--mdp-pos); }

/* (7) Reading-surface refinements (world-class-UX review pass). Font-independent;
   they apply in both mono and proportional font modes. */

/* (Reading-column max-width removed; see the body rule in section 2.) */

/* Display math bound to its prose: left-set + slight indent instead of a centered
   block floating in the column; long equations scroll rather than overflow.
   Derivation rhythm: in these notes a step is "[label]\n$$equation$$" inside ONE
   paragraph, so the equation is a CHILD of its label paragraph. Tight margins here
   hug the equation to its label (within-step); the paragraph's own bottom margin
   then carries the larger between-step gap. Tight-within / loose-between is what
   makes a multi-step derivation read as guided steps, not a flat list (proximity).
   `body` prefix raises specificity above KaTeX's own `.katex-display`, which the
   pandoc --katex stylesheet loads AFTER this block (equal specificity would lose). */
body .katex-display { text-align: left; margin: 0.15em 0; padding-left: 1.5em; overflow-x: auto; overflow-y: hidden; }
body .katex-display > .katex { text-align: left; }
/* thin, quiet scrollbar for equations that overflow (instead of chunky default) */
body .katex-display { scrollbar-width: thin; }
body .katex-display::-webkit-scrollbar { height: 6px; }
body .katex-display::-webkit-scrollbar-thumb { background: var(--mdp-scrollbar); border-radius: 3px; } /* one thumb tone page-wide */

/* Inline math: KaTeX Main's x-height (~0.431em) is far below SF Mono's (~0.53em), so
   1.0em math reads visibly undersized (worst on inline fractions, whose numerals drop
   to script size). 0.53/0.431 = 1.23em is the x-height parity point with the mono. */
.math.inline .katex { font-size: 1.23em; }

/* Links: quiet but persistent underline (a link is a real signal in technical text). */
a { text-decoration: underline; text-decoration-color: var(--mdp-link-underline); text-underline-offset: 0.15em; }
a:hover { text-decoration-color: var(--mdp-link); }

/* Lists: muted markers + hanging indent + tighter nesting. Content leads, not bullets. */
ul, ol { padding-left: 1.4em; }
li { margin: 0.2em 0; }
li::marker { color: var(--mdp-marker); }
li > ul, li > ol { margin: 0.2em 0; }

/* Blockquote: an aside, not an alert. Thin rule + lighter text, no fill. */
blockquote { border-left: 3px solid var(--mdp-quote-rule); border-radius: 0; padding: 0 0 0 1em; margin: 0 0 16px; color: var(--mdp-ink-soft); background: transparent; }

/* Figures: kill the browser-default 40px side margins so images share the text spine;
   captions read as subordinate metadata (small, muted), not an orphan sentence. */
figure { margin: 0 0 16px; }
figcaption { font-size: 0.85em; color: var(--mdp-ink-muted); margin-top: 0.5em; }

/* Task-list checkboxes: OS-default accent is the loudest mark on the page; reuse the
   locked link blue instead of introducing system blue. */
input[type="checkbox"] { accent-color: var(--mdp-link); }

/* Footnote apparatus is subordinate: smaller and muted. */
.footnotes { font-size: 0.9em; color: var(--mdp-marker); }

/* Numeric columns align. */
th, td { font-variant-numeric: tabular-nums; }

/* Inline code inside a heading reads as colored text, not an oversized chip. */
h1 code, h2 code, h3 code, h4 code, h5 code, h6 code { background: none; padding: 0; }

/* (7b) Reading measure + rhythm (designer pass 2026-07-12; palette untouched).
   Cap the measure on TEXT blocks only. The 2026-06-11 body-wide max-width was removed
   because it clipped display math and code; scoping the cap to prose-type elements
   excludes pre / table / .katex-display, so those keep full width + their own
   horizontal scroll and that regression cannot recur. ~48rem = ~80 mono chars. */
body > p, body > ul, body > ol, body > blockquote,
body > h1, body > h2, body > h3, body > h4, body > h5, body > h6 {
  max-width: 48rem;
}
/* Code blocks hug their content like tables (same width recipe as the table rule):
   a 55-char SQL block no longer paints a full-bleed gray slab. */
/* border-box: max-width includes the 16px padding + border, otherwise the pre's
   padding overhangs its wrapper/body by ~34px and re-creates an outer overflow.
   Scrollbar matches the quiet treatment tables and display math already have. */
pre {
  width: max-content; max-width: 100%; margin-bottom: 16px; box-sizing: border-box;
  scrollbar-width: thin; scrollbar-color: var(--mdp-scrollbar) transparent;
}
pre::-webkit-scrollbar { height: 8px; }
pre::-webkit-scrollbar-thumb { background: var(--mdp-scrollbar); border-radius: 4px; }
/* ONE scroll container per code block. Pandoc's own template CSS makes its highlight
   wrapper scroll (div.sourceCode { overflow: auto }) while the upstream VS Code pre
   inside scrolls too, so a long line painted TWO stacked horizontal scrollbars.
   The pre stays the single owner (it carries the border/background, and its
   max-width: 100% of the wrapper means it can never spill a visible-overflow div). */
div.sourceCode { overflow: visible; margin: 0; width: max-content; max-width: 100%; background: none; }
/* Pandoc's .sourceCode sets background: transparent on the pre, which silently moved
   the visible fill to the full-width wrapper div (the "gray slab" came back through
   the back door). The pre is the one filled, bordered, scrolling box; re-assert it. */
pre.sourceCode { background-color: var(--vscode-textCodeBlock-background); }
/* (Page width cap lives in the body rule, section 2.) */
/* A section boundary announces itself: H2 gets more air than a paragraph gap.
   Deliberate divergence from upstream's uniform 24px; H3+ keep the VS Code rhythm. */
body > h2 { margin-top: 32px; }
/* Top-level lists carry the same 16px bottom rhythm as paragraphs; nested stay tight. */
body > ul, body > ol { margin-bottom: 16px; }
/* Display-size mono reads as a title, not a code string, with a whisper of tracking.
   Whole display-heading family (h1-h3); smaller mono headings keep 0 for legibility. */
h1, h2, h3 { letter-spacing: -0.01em; }

/* (8) Derivation chains: whitepaper-proof rhythm (two-designer consensus pass).
   Verified DOM: a step is authored "[label]\n$$eq$$" with no blank line, so pandoc
   emits ONE <p> per step with .katex-display as a CHILD of the label paragraph.
   A CHAIN = two or more consecutive step paragraphs. Only chain members get the
   annotation treatment, so standalone display equations and prose paragraphs that
   happen to end in math stay in normal voice. */

/* Chain member: the paragraph's inline text IS the justification label. Set it as
   a quiet AMS-style annotation (small, italic, muted) sharing one left edge with
   the math. rem sizes track the body size in both font modes. */
/* NOTE: :has() may not nest inside :has(), so "has a following step" is written
   as :has(+ p .katex-display), a relative selector with no inner :has(). */
p:has(.katex-display):has(+ p .katex-display),
p:has(.katex-display) + p:has(.katex-display) {
  font-size: 0.85rem;
  font-style: italic;
  line-height: 1.45;
  color: var(--mdp-ink-faint);
  /* Continuous hairline rail: because inter-step margins are zero, each member's
     border joins into ONE unbroken line down the chain, the visual thread that
     says "one argument" (the calm cousin of an `align` environment's block). */
  border-left: 2px solid var(--mdp-rail);
  padding-left: calc(1.5rem - 2px);
}
/* Fuse the chain into one block: no inter-step margins, just a small
   "same argument" beat. The big prose gap returns after the last member. */
p:has(.katex-display):has(+ p .katex-display) { margin-bottom: 0; }
p:has(.katex-display) + p:has(.katex-display) { margin-top: 0; padding-top: 0.55em; }

/* Restore the equation itself to full prose scale and voice; the shared left
   edge is carried by the paragraph, so the display sheds its own indent. */
p:has(.katex-display):has(+ p .katex-display) .katex-display,
p:has(.katex-display) + p:has(.katex-display) .katex-display {
  font-size: 1rem;
  font-style: normal;
  color: var(--vscode-editor-foreground);
  padding-left: 1.25em; /* equation inset from its label (the pre-rail indent, kept by request) */
  margin: 0.1em 0 0;
}

/* A breath before the boxed conclusion, and the page's one accent on the box
   itself (body prefix outranks katex.css, which loads later). */
p:has(.katex-display) + p:has(.fbox) { padding-top: 1.1em; }
body .katex .fbox { border-color: var(--mdp-link); }

/* (9) Obsidian-style wikilinks ([[target]] via pandoc wikilinks_title_after_pipe).
   Internal references, not web links: accent color, no underline until hover.
   The href is unresolved (bare target), so they're visual references in preview. */
a.wikilink { color: var(--mdp-link); text-decoration: none; }
a.wikilink:hover { text-decoration: underline; text-decoration-color: var(--mdp-link-underline); }
</style>
<script>
/* md-preview numeric-table polish: detect columns whose data cells are all numeric
   (bare integers/decimals, optional minus and trailing %), right-align them
   (.mdp-num, styled above) and insert thousands separators. Column-based so a lone
   number in a prose column is untouched. Frontmatter tables are skipped. Cells with
   child markup (e.g. backticked code) keep their markup, alignment only. */
document.addEventListener('DOMContentLoaded', function () {
  var numRe = /^-?[\d,]+(\.\d+)?%?$/;
  function fmt(t) {
    if (t.indexOf(',') !== -1) return t; /* author already grouped it */
    return t.replace(/\d+/, function (d) {
      /* a bare 4-digit 1900-2100 integer is almost always a year, not money */
      if (d.length < 4 || (d.length === 4 && t === d && +d >= 1900 && +d <= 2100)) return d;
      return Number(d).toLocaleString('en-US');
    });
  }
  document.querySelectorAll('table:not(.mdp-frontmatter)').forEach(function (table) {
    var rows = Array.prototype.slice.call(table.querySelectorAll('tbody tr'));
    if (!rows.length) return;
    var cols = Math.max.apply(null, rows.map(function (r) { return r.cells.length; }));
    var headRow = table.querySelector('thead tr');
    for (var c = 0; c < cols; c++) {
      var cells = rows.map(function (r) { return r.cells[c]; }).filter(Boolean);
      var texts = cells.map(function (td) { return td.textContent.trim(); });
      var nonEmpty = texts.filter(function (t) { return t !== ''; });
      if (!nonEmpty.length) continue;
      if (!nonEmpty.every(function (t) { return numRe.test(t); })) continue;
      cells.forEach(function (td, i) {
        td.classList.add('mdp-num');
        if (texts[i] && td.children.length === 0) td.textContent = fmt(texts[i]);
        /* percent cells get sign color: negative red, positive green, zero neutral */
        if (/%$/.test(texts[i]) && parseFloat(texts[i]) !== 0) {
          td.classList.add(texts[i].charAt(0) === '-' ? 'mdp-neg' : 'mdp-pos');
        }
      });
      if (headRow && headRow.cells[c]) headRow.cells[c].classList.add('mdp-num');
    }
  });
});

/* md-preview table column sizing. Same contract and same thresholds as the Quick Look
   appex (quick-look/Resources/ql-render.js, tightColumns), which does this at render
   time because the panel executes no scripts. CSS auto layout sizes a column by its
   longest word when a prose column competes for the width, so a date column collapses
   and a label column runs three lines deep. Marking is done here; only a theme that
   opts in styles the classes (assets/paper-theme.css does). */
document.addEventListener('DOMContentLoaded', function () {
  var TIGHT_MAX = 16, TIGHT_BUDGET = 40, NARROW_MAX = 34;
  var WIDE_TOTAL = 100, COL_MIN = 22, COL_MAX = 52;
  document.querySelectorAll('table:not(.mdp-frontmatter)').forEach(function (table) {
    var rows = Array.prototype.slice.call(table.querySelectorAll('tr'));
    if (!rows.length) return;
    var cols = Math.max.apply(null, rows.map(function (r) { return r.cells.length; }));
    var widths = [];
    for (var c = 0; c < cols; c++) {
      widths[c] = Math.max.apply(null, rows.map(function (r) {
        return r.cells[c] ? r.cells[c].textContent.trim().length : 0;
      }));
    }
    /* A prose column is what squeezes the others. With none, no column needs help. */
    if (!widths.some(function (w) { return w > NARROW_MAX; })) return;
    var spent = 0;
    var classes = widths.map(function (w) {
      if (w <= TIGHT_MAX && spent + w <= TIGHT_BUDGET) { spent += w; return 'mdp-tight'; }
      return w <= NARROW_MAX ? 'mdp-narrow' : '';
    });
    /* Two prose columns split the width by how much text each holds, so the shorter one
       ends up a few words wide. Four columns run out of room whatever they hold. */
    var wide = cols >= 4 || widths.filter(function (w) { return w > NARROW_MAX; }).length >= 2;
    var share = widths.reduce(function (sum, w, i) {
      return sum + (classes[i] === 'mdp-tight' ? 0 : w);
    }, 0);
    if (wide) table.classList.add('mdp-wide');
    rows.forEach(function (r) {
      for (var i = 0; i < cols; i++) {
        var cell = r.cells[i];
        if (!cell) continue;
        if (classes[i]) cell.classList.add(classes[i]);
        if (!wide || classes[i] === 'mdp-tight' || !share) continue;
        /* Widths in proportion to content are what make a row's columns end level,
           since a cell of length L wrapped at width W is L/W lines tall. */
        var ch = Math.round((widths[i] / share) * WIDE_TOTAL);
        cell.style.minWidth = Math.min(COL_MAX, Math.max(COL_MIN, ch)) + 'ch';
      }
    });
  });
});
</script>
<style>
/* Callouts ("> [!type] title"). Two shapes share these rules: the pandoc path wraps
   the blockquote in a classed div (assets/callouts-to-html.py); the Quick Look appex
   puts the classes on the blockquote itself (quick-look/Resources/ql-render.js). */
.mdp-callout-head { font-weight: 600; margin: 0 0 4px; }
.mdp-callout-head .mdp-callout-title { font-weight: 600; }
blockquote.mdp-callout-note,      .mdp-callout-note      > blockquote { border-left-color: var(--mdp-callout-note); }
blockquote.mdp-callout-tip,       .mdp-callout-tip       > blockquote { border-left-color: var(--mdp-callout-tip); }
blockquote.mdp-callout-important, .mdp-callout-important > blockquote { border-left-color: var(--mdp-callout-important); }
blockquote.mdp-callout-warning,   .mdp-callout-warning   > blockquote { border-left-color: var(--mdp-callout-warning); }
blockquote.mdp-callout-caution,   .mdp-callout-caution   > blockquote { border-left-color: var(--mdp-callout-caution); }
.mdp-callout-note      .mdp-callout-head { color: var(--mdp-callout-note); }
.mdp-callout-tip       .mdp-callout-head { color: var(--mdp-callout-tip); }
.mdp-callout-important .mdp-callout-head { color: var(--mdp-callout-important); }
.mdp-callout-warning   .mdp-callout-head { color: var(--mdp-callout-warning); }
.mdp-callout-caution   .mdp-callout-head { color: var(--mdp-callout-caution); }

/* (10b) Syntax colors routed through tokens. Pandoc writes the tango palette into
   the page head ABOVE this file, so these rules win on source order at equal
   specificity. The light values ARE tango's, so the light page does not change.
   Tokens are the only way section (10) can reach these: the tango block is
   generated per render, so it cannot be edited. */
code span.al { color: var(--mdp-syn-alert); }
code span.an, code span.cn, code span.co, code span.cv, code span.do,
code span.in, code span.ot, code span.pp, code span.wa { color: var(--mdp-syn-comment); }
code span.at, code span.cf, code span.dt, code span.fu, code span.kw { color: var(--mdp-syn-keyword); }
code span.bn, code span.dv, code span.fl { color: var(--mdp-syn-number); }
code span.ch, code span.ss, code span.st, code span.vs { color: var(--mdp-syn-string); }
code span.er { color: var(--mdp-syn-error); }
code span.op, code span.sc { color: var(--mdp-syn-operator); }
code span.va { color: var(--mdp-syn-var); }

/* (10) Dark appearance. Follows the OS/browser setting, no flag and no toggle.
   Only tokens change; every rule above already reads them. Values match the
   Quick Look reading skin so the two surfaces agree.
   The syntax tokens shift tango's dark-on-light hues to light-on-dark ones:
   tango's #204a87 keyword and #0000cf number are unreadable on a dark panel. */
@media (prefers-color-scheme: dark) {
  :root {
    /* Not a token: it tells the engine to paint native widgets dark. Without it an
       unchecked task-list checkbox stays a white square on the dark page. */
    color-scheme: dark;

    --vscode-editor-foreground: #e3e3e6;
    --vscode-editor-background: #23252a;
    --vscode-textCodeBlock-background: #2c2f36;
    --vscode-widget-border: #3c404a;

    --mdp-link: #79b8ff;
    --mdp-link-underline: rgba(121, 184, 255, 0.4);
    --mdp-code-chip-bg: rgba(255, 255, 255, 0.09);
    --mdp-border: rgba(255, 255, 255, 0.18);
    --mdp-border-strong: rgba(255, 255, 255, 0.62);
    --mdp-rule: #3c404a;
    --mdp-rule-soft: #32353c;
    --mdp-rail: #3a3e46;
    --mdp-zebra: #232327;
    --mdp-quote-rule: #4a4a50;
    --mdp-scrollbar: #4a4a50;
    --mdp-ink-muted: #9a9aa2;
    --mdp-ink-soft: #b4b4bc;
    --mdp-ink-faint: #8b8b93;
    --mdp-ink-strong: #f2f2f4;
    --mdp-marker: #8b8b93;
    --mdp-neg: #f2857a;
    --mdp-pos: #5ec99a;
    --mdp-callout-note: #58a6ff;
    --mdp-callout-tip: #56d364;
    --mdp-callout-important: #bc8cff;
    --mdp-callout-warning: #e3b341;
    --mdp-callout-caution: #ff7b72;

    --mdp-syn-alert: #ff7b72;
    --mdp-syn-comment: #b9a06a;
    --mdp-syn-keyword: #8cb4ff;
    --mdp-syn-number: #a2a0ff;
    --mdp-syn-string: #9ece6a;
    --mdp-syn-error: #ff8a80;
    --mdp-syn-operator: #ffa657;
    --mdp-syn-var: #e3e3e6;
  }
  /* Images authored for a white page glare on a dark one. */
  img { filter: brightness(0.92); }
}
</style>
