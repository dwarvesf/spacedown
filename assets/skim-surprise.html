    var lang = cjk > words ? "cjk" : enShare >= EN_SHARE_MIN && viShare < VI_SHARE_MAX ? "en" : "other";
    return { lang: lang, enShare: enShare, viShare: viShare };
  }

  // text in; { tokens, levels, stats } out, or { skipped: true, reason } for a page left unscored.
  function analyze(text, options) {
    var tokens = tokenize(text), seqIdx = [], i, p;
    for (i = 0; i < tokens.length; i++) if (tokens[i].kind !== "space") seqIdx.push(i);
    var tokenCount = seqIdx.length;
    if (tokenCount < options.minTokens) return { skipped: true, reason: "page is too short to score" };

    var keys = new Array(tokenCount);
    for (p = 0; p < tokenCount; p++) keys[p] = tokens[seqIdx[p]].key;
    var model = new NGram();
    model.add(keys);

    var lang = detectLanguage(tokens).lang;
    var basis = tokenCount >= GAIN_MIN_TOKENS ? "gain" : "surprisal";
    var lambda = lang === "other" ? 0 : blendWeight(tokenCount);

    var raw = new Float64Array(tokenCount).fill(NaN), scoreable = 0;
    for (p = 0; p < tokenCount; p++) {
      var token = tokens[seqIdx[p]];
      if (!token.scoreable) continue;
      var prior = builtinProbability(token.key);
      var pMix = Math.max(lambda * prior + (1 - lambda) * model.prob(keys, p), MIN_PROBABILITY);
      var pUni = Math.max(lambda * prior + (1 - lambda) * model.unigram(token.key), MIN_PROBABILITY);
      raw[p] = basis === "gain" ? -Math.log2(pUni) + Math.log2(pMix) : -Math.log2(pMix);
      scoreable++;
    }
    if (scoreable < options.minTokens) return { skipped: true, reason: "not enough words to score" };

    var positions = [], dense = [];
    for (p = 0; p < tokenCount; p++) if (!isNaN(raw[p])) { positions.push(p); dense.push(raw[p]); }
    var smoothed = smooth(Float64Array.from(dense)), spread = iqr(smoothed);
    if (spread < MIN_SPREAD_BITS) return { skipped: true, reason: "page is statistically flat" };

    var ranked = percentileRank(smoothed), centred = new Float64Array(ranked.length);
    for (i = 0; i < ranked.length; i++) centred[i] = ranked[i] - 0.5;
    var denseLevels = toLevels(centred, options.intensity), levels = new Int8Array(tokens.length);
    for (i = 0; i < positions.length; i++) levels[seqIdx[positions[i]]] = denseLevels[i];
    return { tokens: tokens, levels: levels, stats: { tokenCount: tokenCount, lang: lang, basis: basis, spread: spread } };
  }

  window.sdSurprise = { analyze: analyze, RUN_SEPARATOR: RUN_SEPARATOR };
})();
</script>
