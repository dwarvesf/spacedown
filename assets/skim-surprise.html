848\u5e2d\u89c2\u6234\u6743\u9876\u8d3c\u79cb\u7c7b\u75db\u987a\u4f8d\u53f3\u5c0a\u8089\u9519\u505c\u8859\u756a\u666f\u91cf\u8fdf\u745e\u501f\u7279\u8ba9\u7537\u62db\u6258\u51b0\u5229\u9634\u68a6\u7edd\u88c5\u6389\u6768\u5954\u81e3\u7f57\u614c\u83ab\u77e3\u8c61\u52bf\u5386\u6751\u7075\u949f\u5143\u653f\u7565\u534e\u836f\u627e\u4f4e\u53ae\u7239\u675c\u5b97\u5475\u676f\u53f6\u54e9\u6362\u62c9\u58c1\u6302\u7fe0\u6d1e\u51b5\u9ed8\u6069\u72af\u5524\u4f0f\u5f71\u7897\u56f4\u8c13\u8003\u636e\u73a9\u5b83\u8857\u7edf\u5e10\u60dc\u964d\u6a2a\u529d\u9664\u673a\u83dc\u6628\u5385\u5cb8\u6597\u8d25\u6982\u656c\u7d22\u5440\u5f90\u6446\u558a\u65bd\u96c6\u904d\u5fd8\u9898\u5584\u51e1\u8f7f\u4e08\u638c\u719f\u59e8\u9690\u679d\u5c40\u7f8e\u642c\u62ac\u8131\u89c6\u73af\u6839\u4ec7\u5f7c\u5531\u6068\u4e1a\u67e5\u5668\u59b9\u52b3\u826f\u67d0\u79c0\u6c0f\u514d\u4f19\u9c81\u754c\u9aa8\u63a2\u7687\u9b42\u59d4\u654c\u5348\u7535\u9547\u62b1\u4eff\u798f\u9884\u517b\u8d8a\u79d1\u6b47\u96e8\u7ecd\u6574\u9489\u5e99\u5f92\u8d4f\u4f2f\u8425\u70e6\u574f\u706d\u6a21\u724c\u590f\u7aef\u5e02\u5939\u8d85\u8bbe\u658b\u504f\u677f\u6392\u7ae5\u5e7f\u79e6\u987f\u8d24\u652f\u8c03\u5fd7\u81f4\u5948\u51c6\u5706\u9c7c\u53e6\u5e3d\u6d3e\u5bd2\u7ae0\u77a7\u4e2b\u4e13\u8d39\u5347\u5171\u4faf\u9b54\u6298\u8ba8\u6beb\u76d1\u5e16\u8865\u88ad\u4ed8\u5ea7\u5473\u5b58\u820d\u804c\u7530\u8ffd\u4ea1\u9192\u9003\u660f\u65d7\u6731\u52a1\u6349\u6b62\u7763\u9769\u5439\u5077\u5bc6\u9c8d\u68d2\u5b64\u62fe\u6cb9\u7980\u73e0\u9ebb\u5e8a\u4e58\u7d2b\u601c\u5e0c\u5446\u4ec1\u6881\u7bc7\u6d4e\u594f\u591f\u5377\u7af9\u6d17\u7ef4\u7ebf\u732b\u6e56\u6108\u8427\u7981\u6cbb\u4ff1\u695a\u5ef7\u7f18\u6bbf\u683c\u54c0\u9f13\u72d7\u671f\u6276\u8dea\u7070\u82f1\u8f6e\u8c0b\u5490\u606d\u90ed\u95ea\u72f1\u4fee\u6c38\u626c\u6309\u7532\u8499\u65a4\u9760\u8170\u609f\u4e89\u6267\u5f84\u6dfb\u53c2\u9189\u4f8b\u805a\u5e2e\u6478\u67aa\u8bd5\u5370\u767b\u7cfb\u5c42\u80d6\u7eaa\u526f\u7eed\u6ce8\u6028\u5de7\u8584\u5bbd\u533b\u996e\u94fa\u8fd0\u5fe0\u8c3   var VI_SHARE_MAX = 0.1;     // a page with this share of Vietnamese diacritics is Vietnamese whatever the rest says

  // 0.55 for a few hundred tokens, sliding to 0.08 once there are thousands.
  function blendWeight(tokenCount) {
    if (tokenCount <= 400) return 0.55;
    if (tokenCount >= 6000) return 0.08;
    return 0.55 + (0.08 - 0.55) * (Math.log(tokenCount / 400) / Math.log(6000 / 400));
  }
  // lang "en" keeps the English prior, "cjk" keeps the character prior (both exactly as skimgram does),
  // "other" scores on the page alone. A page made of ASCII words alone is never "other", so identifiers,
  // paths and jargon cannot push an English page off the prior; only another script or heavy accents can.
  function detectLanguage(tokens) {
    var words = 0, en = 0, vi = 0, nonAscii = 0, cjk = 0, ranks = enRankMap();
    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i];
      if (t.kind === "cjk") cjk++;
      else if (t.kind === "word") {
        words++;
        if (ranks.has(t.key)) en++;
        if (VI_RE.test(t.key.normalize("NFD"))) vi++;
        if (NON_ASCII_RE.test(t.key)) nonAscii++;
      }
    }
    var enShare = words ? en / words : 0, viShare = words ? vi / words : 0, nonAsciiShare = words ? nonAscii / words : 0;
    var lang = cjk > words ? "cjk" :
      viShare >= VI_SHARE_MAX || (enShare < EN_SHARE_MIN && nonAsciiShare >= NON_ASCII_MIN) ? "other" : "en";
    return { lang: lang, enShare: enShare, viShare: viShare, nonAsciiShare: nonAsciiShare };
  }

  // text in; { tokens, levels, stats, scores } out, or { skipped: true, reason } for a page left unscored.
  // options: minTokens (default 80), intensity 0..100 (default 50), basis "auto" | "surprisal" | "gain" (default "auto").
  // scores.raw is the bits per sequence position (NaN where the token is not scored), scores.smoothed the
  // 3-point average of the scored ones; the parity script compares both with skimgram's.
  function analyze(text, options) {
    var minTokens = options.minTokens === undefined ? 80 : options.minTokens;
    var intensity = options.intensity === undefined ? 50 : options.intensity;
    var tokens = tokenize(text), seqIdx = [], i, p;
    for (i = 0; i < tokens.length; i++) if (tokens[i].kind !== "space") seqIdx.push(i);
    var tokenCount = seqIdx.length;
    if (tokenCount < minTokens) return { skipped: true, reason: "page is too short to analyse", tokenCount: tokenCount };

    var keys = new Array(tokenCount);
    for (p = 0; p < tokenCount; p++) keys[p] = tokens[seqIdx[p]].key;
    var model = new NGram();
    model.add(keys);

    var lang = detectLanguage(tokens).lang;
    var basis = options.basis && options.basis !== "auto" ? options.basis : tokenCount >= GAIN_MIN_TOKENS ? "gain" : "surprisal";
    var lambda = lang === "other" ? 0 : blendWeight(tokenCount);

    var raw = new Float64Array(tokenCount).fill(NaN), scoreable = 0;
    for (p = 0; p < tokenCount; p++) {
      var token = tokens[seqIdx[p]];
      if (!token.scoreable) continue;
      var prior = builtinProbability(token.key);
      var pMix = Math.max(lambda * prior + (1 - lambda) * model.prob(keys, p), MIN_PROBABILITY);
      var pUni = Math.max(lambda * prior + (1 - lambda) * model.unigram(token.key), MIN_PROBABILITY);
      raw[p] = basis === "gain" ? -Math.log2(pUni) + Math.log2(pMix) : -Math.log2(pMix);
      scoreable++;
    }
    if (scoreable < minTokens) return { skipped: true, reason: "not enough scoreable tokens" };

    var positions = [], dense = [];
    for (p = 0; p < tokenCount; p++) if (!isNaN(raw[p])) { positions.push(p); dense.push(raw[p]); }
    var smoothed = smooth(Float64Array.from(dense)), spread = iqr(smoothed);
    if (spread < MIN_SPREAD_BITS) return { skipped: true, reason: "page is statistically flat" };

    var ranked = percentileRank(smoothed), centred = new Float64Array(ranked.length);
    for (i = 0; i < ranked.length; i++) centred[i] = ranked[i] - 0.5;
    var denseLevels = toLevels(centred, intensity), levels = new Int8Array(tokens.length);
    for (i = 0; i < positions.length; i++) levels[seqIdx[positions[i]]] = denseLevels[i];
    return {
      tokens: tokens, levels: levels,
      stats: { tokenCount: tokenCount, lang: lang, basis: basis, spread: spread },
      scores: { seqIdx: seqIdx, raw: raw, smoothed: smoothed }
    };
  }

  window.sdSurprise = { analyze: analyze, tokenize: tokenize, flatten: flatten, RUN_SEPARATOR: RUN_SEPARATOR };
})();
</script>
