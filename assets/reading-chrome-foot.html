<script>
/* spacedown reading chrome JS: outline scroll-spy + progress bar + zoom + copy-source + print.
   Injected at end of <body> via pandoc --include-after-body, after the #sd-src element.
   Pairs with assets/reading-chrome-head.html. Self-contained, no dependencies. */
(function () {
  "use strict";
  var ZOOMS = [50, 60, 70, 80, 90, 100, 110, 125, 150, 175, 200, 250, 300];
  var DEFAULT_IDX = 5; // 100%
  var KEY = "sd-zoom";
  var doc = document.documentElement;
  var toc = document.getElementById("TOC");

  // ---- collapsible outline ----
  var TOC_KEY = "sd-toc-collapsed";
  var tocToggle = null;
  function tocCollapsed() { return doc.classList.contains("sd-toc-collapsed"); }
  function applyToc(collapsed) {
    doc.classList.toggle("sd-toc-collapsed", collapsed);
    if (tocToggle) tocToggle.setAttribute("aria-expanded", String(!collapsed));
    try { localStorage.setItem(TOC_KEY, collapsed ? "1" : "0"); } catch (e) {}
  }
  function toggleToc() { applyToc(!tocCollapsed()); }
  function initialTocCollapsed() {
    var v = null;
    try { v = localStorage.getItem(TOC_KEY); } catch (e) {}
    if (v === "1") return true;
    if (v === "0") return false;
    return window.matchMedia("(max-width: 900px)").matches; // first-ever: width decides
  }

  // Reveal the sidebar + shift the body only when there are real entries; then wire
  // the collapse toggle (also gated on real entries).
  if (toc && toc.querySelector("a")) {
    doc.classList.add("sd-has-toc");
    toc.setAttribute("aria-label", "Document outline");

    // Header strip at the top of the sidebar: CSS draws the "Outline" label + divider and
    // reserves the chrome lane; the (body-child) toggle visually docks into its right edge.
    var tocHeader = document.createElement("div");
    tocHeader.className = "sd-toc-header";
    toc.insertBefore(tocHeader, toc.firstChild);

    // Set saved/default state BEFORE first paint so it never flashes or animates in.
    doc.classList.toggle("sd-toc-collapsed", initialTocCollapsed());

    tocToggle = document.createElement("button");
    tocToggle.className = "sd-toc-toggle";
    tocToggle.setAttribute("aria-label", "Toggle outline");
    tocToggle.setAttribute("aria-controls", "TOC");
    tocToggle.setAttribute("aria-expanded", String(!tocCollapsed()));
    tocToggle.title = "Toggle outline ([)";
    tocToggle.addEventListener("click", toggleToc);
    document.body.appendChild(tocToggle);

    // Enable transitions only after first paint: initial state is instant, later toggles animate.
    requestAnimationFrame(function () { doc.classList.add("sd-anim-ready"); });

    // Self-correct on resize: the width decision otherwise runs only at load, so a
    // window dragged below the breakpoint kept an expanded sidebar and crushed the
    // content to ~300px. Force-collapse without persisting (a responsive squeeze is
    // not a user preference); never auto-expand on widen (an explicit collapse stays).
    var mdpResizeT = null;
    window.addEventListener("resize", function () {
      clearTimeout(mdpResizeT);
      mdpResizeT = setTimeout(function () {
        if (window.matchMedia("(max-width: 900px)").matches && !tocCollapsed()) {
          doc.classList.add("sd-toc-collapsed");
          if (tocToggle) tocToggle.setAttribute("aria-expanded", "false");
        }
      }, 150);
    });
  }

  // ---- zoom ----
  function clampIdx(i) { return Math.max(0, Math.min(ZOOMS.length - 1, i)); }
  function nearestIdx(pct) {
    var best = DEFAULT_IDX, bd = Infinity;
    for (var i = 0; i < ZOOMS.length; i++) {
      var d = Math.abs(ZOOMS[i] - pct);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  var idx = DEFAULT_IDX;
  try {
    var saved = parseInt(localStorage.getItem(KEY), 10);
    if (!isNaN(saved)) idx = nearestIdx(saved);
  } catch (e) {}

  var pctEl;
  function apply() {
    var pct = ZOOMS[idx];
    doc.style.setProperty("--sd-zoom", (pct / 100).toString());
    if (pctEl) {
      pctEl.textContent = pct + "%";
      pctEl.setAttribute("aria-label", "Reset zoom (now " + pct + "%)");
    }
    try { localStorage.setItem(KEY, String(pct)); } catch (e) {}
  }
  function zoomIn() { idx = clampIdx(idx + 1); apply(); }
  function zoomOut() { idx = clampIdx(idx - 1); apply(); }
  function zoomReset() { idx = DEFAULT_IDX; apply(); }

  // ---- toolbar icons: inline SVG in the Lucide style (24px grid, 1.75 stroke, round caps,
  //      currentColor), drawn for spacedown. Static strings, never built from document text. ----
  function icon(paths) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" ' +
      'aria-hidden="true" focusable="false">' + paths + '</svg>';
  }
  var GLASS = '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>';
  var ICONS = {
    zoomOut: icon(GLASS + '<path d="M8 11h6"/>'),
    zoomIn: icon(GLASS + '<path d="M8 11h6M11 8v6"/>'),
    copy: icon('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'),
    check: icon('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    print: icon('<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/>')
  };
  var COPY_LABEL = "Copy source";

  // ---- copy-source (raw markdown, base64-embedded for UTF-8 + file:// safety) ----
  function decodeSrc() {
    var el = document.getElementById("sd-src");
    if (!el) return "";
    var b64 = el.textContent.replace(/\s+/g, "");
    try {
      var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      return new TextDecoder("utf-8").decode(bytes);
    } catch (e) { return ""; }
  }
  function flashDone(btn) {
    btn.innerHTML = ICONS.check; btn.classList.add("sd-done");
    btn.setAttribute("aria-label", "Copied"); btn.title = "Copied";
    setTimeout(function () {
      btn.innerHTML = ICONS.copy; btn.classList.remove("sd-done");
      btn.setAttribute("aria-label", COPY_LABEL); btn.title = COPY_LABEL;
    }, 1500);
  }
  function legacyCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
  function copySource(btn) {
    var md = decodeSrc();
    var done = function () { flashDone(btn); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(done, function () { legacyCopy(md, done); });
    } else {
      legacyCopy(md, done);
    }
  }

  // ---- build toolbar ----
  // Every control is a real button with an aria-label and a title tooltip.
  function btn(cls, svg, label, title, fn) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls; b.innerHTML = svg;
    b.setAttribute("aria-label", label); b.title = title;
    b.addEventListener("click", function () { fn(b); });
    return b;
  }
  var bar = document.createElement("div");
  bar.className = "sd-toolbar";
  bar.setAttribute("role", "toolbar");
  bar.setAttribute("aria-label", "Reading tools");
  bar.appendChild(btn("sd-zoom-out", ICONS.zoomOut, "Zoom out", "Zoom out (Cmd -)", zoomOut));
  pctEl = btn("sd-zoom-pct", "", "Reset zoom", "Reset zoom (Cmd 0)", zoomReset);
  bar.appendChild(pctEl);
  bar.appendChild(btn("sd-zoom-in", ICONS.zoomIn, "Zoom in", "Zoom in (Cmd +)", zoomIn));
  var sep = document.createElement("span"); sep.className = "sd-sep";
  sep.setAttribute("aria-hidden", "true");
  bar.appendChild(sep);
  bar.appendChild(btn("sd-copy", ICONS.copy, COPY_LABEL, "Copy the raw markdown to the clipboard", copySource));
  bar.appendChild(btn("sd-print", ICONS.print, "Print", "Print this page", function () { window.print(); }));
  document.body.appendChild(bar);

  // ---- reading progress: a 2px bar at the top, scaled to how far down the page we are ----
  var progress = document.createElement("div");
  progress.className = "sd-progress";
  progress.setAttribute("aria-hidden", "true");
  document.body.appendChild(progress);
  var progressQueued = false;
  function paintProgress() {
    progressQueued = false;
    var max = doc.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, (window.pageYOffset || doc.scrollTop) / max)) : 0;
    progress.style.transform = "scaleX(" + p.toFixed(4) + ")";
  }
  function queueProgress() {
    if (progressQueued) return;
    progressQueued = true;
    requestAnimationFrame(paintProgress);
  }
  window.addEventListener("scroll", queueProgress, { passive: true });
  window.addEventListener("resize", queueProgress);
  paintProgress();

  apply(); // sets --sd-zoom + the pct label from saved/default

  // ---- keyboard: Cmd/Ctrl +/-/0 (override the browser's own page zoom) ----
  window.addEventListener("keydown", function (e) {
    // outline toggle: bare "[", ignored when modified or while typing in an editable
    if (e.key === "[" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var ae = document.activeElement;
      var editable = ae && (ae.isContentEditable ||
        /^(input|textarea|select)$/i.test(ae.tagName));
      if (!editable && doc.classList.contains("sd-has-toc")) {
        e.preventDefault(); toggleToc(); return;
      }
    }
    if (!(e.metaKey || e.ctrlKey)) return;
    if (e.key === "=" || e.key === "+") { e.preventDefault(); zoomIn(); }
    else if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomOut(); }
    else if (e.key === "0") { e.preventDefault(); zoomReset(); }
  });

  // ---- scroll-spy: highlight the section currently in view ----
  if (doc.classList.contains("sd-has-toc")) {
    var links = {};
    toc.querySelectorAll('a[href^="#"]').forEach(function (a) {
      var id = decodeURIComponent(a.getAttribute("href").slice(1));
      if (id) links[id] = a;
    });
    var heads = Object.keys(links)
      .map(function (id) { return document.getElementById(id); })
      .filter(Boolean);
    // Keep the active outline item in view inside the sidebar's own scroll, without moving the page.
    var TOC_HEAD = 44;
    function revealInOutline(a) {
      var top = a.offsetTop, bottom = top + a.offsetHeight;
      if (top < toc.scrollTop + TOC_HEAD + 8) toc.scrollTop = Math.max(0, top - TOC_HEAD - 8);
      else if (bottom > toc.scrollTop + toc.clientHeight - 12) toc.scrollTop = bottom - toc.clientHeight + 12;
    }
    if ("IntersectionObserver" in window && heads.length) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          var a = links[en.target.id];
          if (!a) return;
          for (var k in links) links[k].classList.remove("sd-active");
          a.classList.add("sd-active");
          revealInOutline(a);
        });
      }, { rootMargin: "0px 0px -75% 0px", threshold: 0 });
      heads.forEach(function (h) { io.observe(h); });
    }
  }

  // ---- frontmatter "Show more": clamp long values, reveal on demand ----
  // CSS line-clamps .sd-fm-clamp to a few lines. Only add a toggle when the value actually
  // overflows the clamp (so a value that fits gets no button).
  document.querySelectorAll("td.sd-fm-long").forEach(function (td) {
    var clamp = td.querySelector(".sd-fm-clamp");
    if (!clamp) return;
    if (clamp.scrollHeight - clamp.clientHeight < 4) return; // fits within the clamp, no toggle
    var btn = document.createElement("button");
    btn.className = "sd-fm-more";
    btn.textContent = "Show more";
    btn.setAttribute("aria-expanded", "false");
    btn.addEventListener("click", function () {
      var open = td.classList.toggle("sd-fm-expanded");
      btn.textContent = open ? "Show less" : "Show more";
      btn.setAttribute("aria-expanded", String(open));
    });
    td.appendChild(btn);
  });
})();
</script>
