<script>
/* spacedown reading chrome JS: outline scroll-spy + progress bar + zoom + reading modes + copy-source + print.
   Injected at end of <body> via pandoc --include-after-body, after the #sd-src element.
   Pairs with assets/reading-chrome-head.html; Skim also needs assets/skim-surprise.html,
   which loads before this script. Self-contained, no dependencies. */
(function () {
  "use strict";
  var ZOOMS = [50, 60, 70, 80, 90, 100, 110, 125, 150, 175, 200, 250, 300];
  var DEFAULT_IDX = 5; // 100%
  var KEY = "sd-zoom";
  var doc = document.documentElement;
  var toc = document.getElementById("TOC");

  // ---- collapsible outline ----
  var TOC_KEY = "sd-toc-collapsed";
  var tocToggle = null;
  function tocCollapsed() { return doc.classList.contains("sd-toc-collapsed"); }
  function applyToc(collapsed) {
    doc.classList.toggle("sd-toc-collapsed", collapsed);
    if (tocToggle) tocToggle.setAttribute("aria-expanded", String(!collapsed));
    try { localStorage.setItem(TOC_KEY, collapsed ? "1" : "0"); } catch (e) {}
  }
  function toggleToc() { applyToc(!tocCollapsed()); }
  function initialTocCollapsed() {
    var v = null;
    try { v = localStorage.getItem(TOC_KEY); } catch (e) {}
    if (v === "1") return true;
    if (v === "0") return false;
    return window.matchMedia("(max-width: 900px)").matches; // first-ever: width decides
  }

  // Reveal the sidebar + shift the body only when there are real entries; then wire
  // the collapse toggle (also gated on real entries).
  if (toc && toc.querySelector("a")) {
    doc.classList.add("sd-has-toc");
    toc.setAttribute("aria-label", "Document outline");

    // Header strip at the top of the sidebar: CSS draws the "Outline" label + divider and
    // reserves the chrome lane; the (body-child) toggle visually docks into its right edge.
    var tocHeader = document.createElement("div");
    tocHeader.className = "sd-toc-header";
    toc.insertBefore(tocHeader, toc.firstChild);

    // Set saved/default state BEFORE first paint so it never flashes or animates in.
    doc.classList.toggle("sd-toc-collapsed", initialTocCollapsed());

    tocToggle = document.createElement("button");
    tocToggle.className = "sd-toc-toggle";
    tocToggle.setAttribute("aria-label", "Toggle outline");
    tocToggle.setAttribute("aria-controls", "TOC");
    tocToggle.setAttribute("aria-expanded", String(!tocCollapsed()));
    tocToggle.title = "Toggle outline ([)";
    tocToggle.addEventListener("click", toggleToc);
    document.body.appendChild(tocToggle);

    // Enable transitions only after first paint: initial state is instant, later toggles animate.
    requestAnimationFrame(function () { doc.classList.add("sd-anim-ready"); });

    // Self-correct on resize: the width decision otherwise runs only at load, so a
    // window dragged below the breakpoint kept an expanded sidebar and crushed the
    // content to ~300px. Force-collapse without persisting (a responsive squeeze is
    // not a user preference); never auto-expand on widen (an explicit collapse stays).
    var mdpResizeT = null;
    window.addEventListener("resize", function () {
      clearTimeout(mdpResizeT);
      mdpResizeT = setTimeout(function () {
        if (window.matchMedia("(max-width: 900px)").matches && !tocCollapsed()) {
          doc.classList.add("sd-toc-collapsed");
          if (tocToggle) tocToggle.setAttribute("aria-expanded", "false");
        }
      }, 150);
    });
  }

  // ---- zoom ----
  function clampIdx(i) { return Math.max(0, Math.min(ZOOMS.length - 1, i)); }
  function nearestIdx(pct) {
    var best = DEFAULT_IDX, bd = Infinity;
    for (var i = 0; i < ZOOMS.length; i++) {
      var d = Math.abs(ZOOMS[i] - pct);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  var idx = DEFAULT_IDX;
  try {
    var saved = parseInt(localStorage.getItem(KEY), 10);
    if (!isNaN(saved)) idx = nearestIdx(saved);
  } catch (e) {}

  var pctEl;
  function apply() {
    var pct = ZOOMS[idx];
    doc.style.setProperty("--sd-zoom", (pct / 100).toString());
    if (pctEl) {
      pctEl.textContent = pct + "%";
      pctEl.setAttribute("aria-label", "Reset zoom (now " + pct + "%)");
    }
    try { localStorage.setItem(KEY, String(pct)); } catch (e) {}
    scheduleBeeline(); // a new text size moves the line breaks
  }
  function zoomIn() { idx = clampIdx(idx + 1); apply(); }
  function zoomOut() { idx = clampIdx(idx - 1); apply(); }
  function zoomReset() { idx = DEFAULT_IDX; apply(); }

  // ---- toolbar icons: inline SVG in the Lucide style (24px grid, 1.75 stroke, round caps,
  //      currentColor), drawn for spacedown. Static strings, never built from document text. ----
  function icon(paths) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" ' +
      'aria-hidden="true" focusable="false">' + paths + '</svg>';
  }
  var GLASS = '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>';
  var ICONS = {
    zoomOut: icon(GLASS + '<path d="M8 11h6"/>'),
    zoomIn: icon(GLASS + '<path d="M8 11h6M11 8v6"/>'),
    copy: icon('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'),
    check: icon('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    read: icon('<path d="M4 6h16M4 18h10"/><rect x="4" y="10" width="9" height="4" rx="1" fill="currentColor"/>'),
    play: icon('<path d="M8 5.5l10 6.5-10 6.5z" fill="currentColor"/>'),
    pause: icon('<path d="M8.5 5.5v13M15.5 5.5v13"/>'),
    back: icon('<path d="M14.5 6l-6 6 6 6"/>'),
    forward: icon('<path d="M9.5 6l6 6-6 6"/>'),
    minus: icon('<path d="M6 12h12"/>'),
    plus: icon('<path d="M6 12h12M12 6v12"/>'),
    close: icon('<path d="M6 6l12 12M18 6L6 18"/>'),
    print: icon('<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/>')
  };
  var COPY_LABEL = "Copy source";

  // ---- read modes: one active at a time ----
  // The mode lives in data-sd-read-mode plus a matching html.sd-<mode> class that the CSS keys on.
  // Leaving a mode hands the text back untouched (see restoreText), so modes never stack markup.
  // The toolbar "Read" menu picks the mode; S toggles the last one used. RSVP is not saved as the
  // current mode (a reload must not open an overlay) but is remembered as the last one used.
  var MODE_KEY = "sd-read-mode", LAST_KEY = "sd-read-last";
  var READ_MODES = ["skim", "bionic", "beeline", "rsvp"];
  var MODE_LABELS = { skim: "Skim", bionic: "Bionic", beeline: "BeeLine", rsvp: "RSVP" };
  var MODE_HINTS = {
    skim: "fade the words the page makes predictable",
    bionic: "bold the start of each word",
    beeline: "colour each line so the eye finds the next",
    rsvp: "one word at a time"
  };
  var lastMode = "skim", readTrigger = null, readNote = "", readItems = {};
  function modeAvailable(m) { return READ_MODES.indexOf(m) >= 0 && (m !== "skim" || !!window.sdSurprise); }
  function readMode() { return doc.getAttribute("data-sd-read-mode") || ""; }
  function updateReadTrigger() {
    if (!readTrigger) return;
    var m = readMode(), label = "Reading mode: " + (m ? MODE_LABELS[m] : "Off");
    readTrigger.classList.toggle("sd-on", !!m);
    readTrigger.setAttribute("aria-label", label + readNote);
    readTrigger.title = label + readNote + " (S)";
  }
  function applyReadMode(mode, persist) {
    if (!modeAvailable(mode)) mode = "";
    var prev = readMode();
    if (prev && prev !== mode) leaveMode(prev);
    READ_MODES.forEach(function (m) {
      doc.classList.toggle("sd-" + m, m === mode);
      if (readItems[m]) readItems[m].setAttribute("aria-checked", String(m === mode));
    });
    if (readItems.off) readItems.off.setAttribute("aria-checked", String(!mode));
    if (mode) doc.setAttribute("data-sd-read-mode", mode); else doc.removeAttribute("data-sd-read-mode");
    if (mode) lastMode = mode;
    if (mode !== prev) readNote = "";
    if (mode && mode !== prev) {
      try { enterMode(mode); } catch (e) { leaveMode(mode); }
    }
    updateReadTrigger();
    updateSkimPanel();
    if (persist) {
      try {
        localStorage.setItem(MODE_KEY, mode === "rsvp" ? "" : mode);
        if (mode) localStorage.setItem(LAST_KEY, mode);
      } catch (e) {}
    }
  }
  function toggleLastMode() { applyReadMode(readMode() ? "" : lastMode, true); }
  // "surprise" was the name of the scored Skim before it became the only one, and an older "skim"
  // meant a rules-based fade; both now mean the one Skim.
  function savedName(v) { return v === "surprise" ? "skim" : v; }
  var savedMode = "";
  try {
    savedMode = savedName(localStorage.getItem(MODE_KEY) || "");
    var savedLast = savedName(localStorage.getItem(LAST_KEY) || savedMode);
    if (modeAvailable(savedLast)) lastMode = savedLast;
  } catch (e) {}
  if (!modeAvailable(lastMode)) lastMode = "bionic"; // no Skim engine on this page
  // The saved mode is applied once the page is built (end of this script), so the DOM modes see final text.

  // ---- Skim settings: the emphasis styles, how much of the page is marked, and what the score measures ----
  // The same three settings skimgram has. They live in localStorage like the mode. The default emphasis is
  // Dim only (skimgram ships Dim and Heat): on real pages Heat boxed too many words to read. Heat and
  // Underline stay one click away. Settings saved before that change have no sd-skim-ver; for them a
  // stored "dim,heat" is the old default, not a choice, so it is ignored. Any other saved mix is kept, and
  // so is Dim and Heat picked after the change (saving writes the version).
  var SK_EMPH = ["dim", "heat", "underline"], SK_BASES = ["auto", "surprisal", "gain"];
  var sk = { emph: ["dim"], intensity: 50, basis: "auto" };
  try {
    var savedEmph = localStorage.getItem("sd-skim-emph");
    if (savedEmph === "dim,heat" && localStorage.getItem("sd-skim-ver") !== "2") savedEmph = null;
    if (savedEmph !== null) sk.emph = SK_EMPH.filter(function (m) { return savedEmph.split(",").indexOf(m) >= 0; });
    var savedIntensity = parseInt(localStorage.getItem("sd-skim-intensity"), 10);
    if (!isNaN(savedIntensity)) sk.intensity = Math.max(0, Math.min(100, savedIntensity));
    var savedBasis = localStorage.getItem("sd-skim-basis");
    if (SK_BASES.indexOf(savedBasis) >= 0) sk.basis = savedBasis;
  } catch (e) {}
  function saveSkim() {
    try {
      localStorage.setItem("sd-skim-ver", "2");
      localStorage.setItem("sd-skim-emph", sk.emph.join(","));
      localStorage.setItem("sd-skim-intensity", String(sk.intensity));
      localStorage.setItem("sd-skim-basis", sk.basis);
    } catch (e) {}
  }

  // ---- what the reading modes skip ----
  // HARD and SKIP are shared by the prose modes (proseNodes below).
  var HARD = "script, style, noscript, textarea";
  var SKIP = "code, pre, a, .katex, table.sd-frontmatter, nav, .sd-toolbar, .sd-toc-toggle, " +
    "strong, b, h1, h2, h3, h4, h5, h6, th, td:first-child, button, svg";

  // ---- the prose modes: Skim, Bionic, BeeLine, RSVP ----
  // They read the same prose: text inside p, li, td, blockquote, dd and figcaption, skipping code,
  // links, math, bold, headings, the first table cell, the frontmatter table and the chrome. RSVP
  // keeps links and bold, since dropping them would cut sentences, and reads headings too.
  // Every wrapping mode records each text node it replaces, so restoreText() puts the very same
  // nodes back: turning a mode off, or switching to another, leaves the original DOM.
  var PROSE = "p, li, td, blockquote, dd, figcaption";
  var READ_BLOCK = PROSE + ", h1, h2, h3, h4, h5, h6, summary";
  var READ_SKIP = "code, pre, .katex, table.sd-frontmatter, nav, .sd-toolbar, .sd-toc-toggle, button, svg";
  var undo = [];
  function proseNodes(blocks, skip) {
    var out = [], walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    for (var n = walker.nextNode(); n; n = walker.nextNode()) {
      var p = n.parentElement;
      if (p && n.nodeValue.trim() && !p.closest(HARD) && !p.closest(skip) && p.closest(blocks)) out.push(n);
    }
    return out;
  }
  function replaceNode(node, frag) {
    var made = Array.prototype.slice.call(frag.childNodes);
    node.parentNode.replaceChild(frag, node);
    undo.push({ orig: node, made: made });
  }
  function restoreText() {
    for (var i = undo.length - 1; i >= 0; i--) {
      var u = undo[i], first = u.made[0];
      if (!first || !first.parentNode) continue;
      first.parentNode.insertBefore(u.orig, first);
      u.made.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); });
    }
    undo = [];
  }
  function textNode(s) { return document.createTextNode(s); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function enterMode(mode) {
    if (mode === "skim") enterSkim();
    else if (mode === "bionic") enterBionic();
    else if (mode === "beeline") enterBeeline();
    else if (mode === "rsvp") openRsvp();
  }
  function leaveMode(mode) {
    if (mode === "rsvp") closeRsvp();
    doc.removeAttribute("data-sd-skim");
    restoreText();
    bl.words = [];
  }

  // ---- Skim: score the prose with assets/skim-surprise.html, fade the predictable ----
  // The text nodes become one flat string (a separator between nodes, cut at the engine's size cap);
  // the scorer returns a level per token, -2 (expected) to 2 (surprising). Level 0 stays plain text,
  // so only words that move away from the middle get a span: span.sd-sk with data-sk set to the
  // level. html[data-sd-skim] lists the emphasis styles in force; the CSS keys on it. A page too
  // short or too flat to score is left alone and the toolbar tooltip says so.
  function enterSkim() {
    var core = window.sdSurprise, nodes = proseNodes(PROSE, SKIP);
    var flat = core.flatten(nodes.map(function (node) { return node.nodeValue; }));
    var res = core.analyze(flat.text, { minTokens: 80, intensity: sk.intensity, basis: sk.basis });
    if (res.skipped) { readNote = ", " + res.reason; return; }
    doc.setAttribute("data-sd-skim", sk.emph.join(" "));
    var cursor = 0;
    flat.starts.forEach(function (start, n) {
      var node = nodes[n], data = node.nodeValue, runEnd = start + data.length;
      while (cursor < res.tokens.length && res.tokens[cursor].end <= start) cursor++;
      var frag = document.createDocumentFragment(), at = start, marked = false;
      for (var t = cursor; t < res.tokens.length && res.tokens[t].start < runEnd; t++) {
        var from = Math.max(res.tokens[t].start, start), to = Math.min(res.tokens[t].end, runEnd);
        if (to <= from || !res.levels[t]) continue;
        if (from > at) frag.appendChild(textNode(data.slice(at - start, from - start)));
        var span = el("span", "sd-sk", data.slice(from - start, to - start));
        span.setAttribute("data-sk", String(res.levels[t]));
        frag.appendChild(span);
        at = to;
        marked = true;
      }
      if (!marked) return;
      if (at < runEnd) frag.appendChild(textNode(data.slice(at - start)));
      replaceNode(node, frag);
    });
  }
  // A new intensity or score basis changes the levels, so the page is scored again from its original text.
  function rescoreSkim() {
    if (readMode() !== "skim") return;
    doc.removeAttribute("data-sd-skim");
    restoreText();
    readNote = "";
    try { enterSkim(); } catch (e) { doc.removeAttribute("data-sd-skim"); restoreText(); }
    updateReadTrigger();
  }
  // The emphasis styles only change the CSS keys, so no scoring is needed.
  function applySkimStyles() {
    if (doc.hasAttribute("data-sd-skim")) doc.setAttribute("data-sd-skim", sk.emph.join(" "));
  }
  var skimPanel = null;
  function updateSkimPanel() { if (skimPanel) skimPanel.hidden = readMode() !== "skim"; }
  function buildSkimPanel() {
    var panel = el("div", "sd-skim-panel");
    panel.setAttribute("role", "group");
    panel.setAttribute("aria-label", "Skim settings");
    panel.hidden = true;
    function row(label, valueEl) {
      var r = el("div", "sd-sk-row"), l = el("div", "sd-sk-label");
      l.appendChild(el("span", "", label));
      if (valueEl) l.appendChild(valueEl);
      r.appendChild(l);
      panel.appendChild(r);
      return r;
    }
    var seg = el("div", "sd-sk-seg"), optButtons = {};
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "Emphasis");
    function syncEmph() { SK_EMPH.forEach(function (m) { optButtons[m].setAttribute("aria-pressed", String(sk.emph.indexOf(m) >= 0)); }); }
    SK_EMPH.forEach(function (m) {
      var b = el("button", "sd-sk-opt", m.charAt(0).toUpperCase() + m.slice(1));
      b.type = "button";
      b.addEventListener("click", function () {
        sk.emph = SK_EMPH.filter(function (x) { return x === m ? sk.emph.indexOf(m) < 0 : sk.emph.indexOf(x) >= 0; });
        saveSkim(); syncEmph(); applySkimStyles();
      });
      optButtons[m] = b;
      seg.appendChild(b);
    });
    syncEmph();
    row("Emphasis").appendChild(seg);

    var value = el("output", "sd-sk-value", String(sk.intensity)), range = el("input");
    range.type = "range"; range.min = "0"; range.max = "100"; range.step = "5"; range.value = String(sk.intensity);
    range.setAttribute("aria-label", "Intensity");
    var rescoreTimer = null;
    range.addEventListener("input", function () {
      sk.intensity = parseInt(range.value, 10);
      value.textContent = range.value;
      saveSkim();
      clearTimeout(rescoreTimer);
      rescoreTimer = setTimeout(rescoreSkim, 120);
    });
    row("Intensity", value).appendChild(range);

    var basis = el("select");
    basis.setAttribute("aria-label", "Score basis");
    [["auto", "Auto"], ["surprisal", "Surprisal"], ["gain", "Contextual gain"]].forEach(function (o) {
      var opt = el("option", "", o[1]);
      opt.value = o[0];
      basis.appendChild(opt);
    });
    basis.title = "Auto picks contextual gain on long pages and surprisal on short ones. Surprisal marks what is hardest to predict. Gain marks where the context failed to help.";
    basis.value = sk.basis;
    basis.addEventListener("change", function () { sk.basis = basis.value; saveSkim(); rescoreSkim(); });
    row("Score").appendChild(basis);
    skimPanel = panel;
    return panel;
  }

  // ---- Bionic: bold the start of every word ----
  // About 45% of the letters, at least one; a word of 1 to 3 letters bolds its first letter.
  // Letters are counted without combining marks, so a decomposed Vietnamese vowel stays whole.
  function boldCut(word) {
    var starts = [], i;
    for (i = 0; i < word.length; i++) if (!/[\u0300-\u036f\udc00-\udfff]/.test(word.charAt(i))) starts.push(i);
    var keep = starts.length <= 3 ? 1 : Math.max(1, Math.round(starts.length * 0.45));
    return keep >= starts.length ? word.length : starts[keep];
  }
  function enterBionic() {
    var wordRe;
    try { wordRe = new RegExp("[\\p{L}\\p{M}\\p{N}]+(?:['\u2019][\\p{L}\\p{M}]+)*", "gu"); } catch (e) { return; }
    proseNodes(PROSE, SKIP).forEach(function (node) {
      var text = node.nodeValue, frag = document.createDocumentFragment(), at = 0, m;
      wordRe.lastIndex = 0;
      while ((m = wordRe.exec(text))) {
        var cut = boldCut(m[0]);
        if (m.index > at) frag.appendChild(textNode(text.slice(at, m.index)));
        frag.appendChild(el("b", "sd-bi", m[0].slice(0, cut)));
        if (cut < m[0].length) frag.appendChild(textNode(m[0].slice(cut)));
        at = m.index + m[0].length;
      }
      if (!frag.childNodes.length) return;
      if (at < text.length) frag.appendChild(textNode(text.slice(at)));
      replaceNode(node, frag);
    });
  }

  // ---- BeeLine: a colour gradient along each rendered line ----
  // Each word is a span; the layout pass groups the spans of a block into lines by offsetTop. Line 1
  // runs ink to blue, line 2 blue to ink to red, line 3 red to ink to blue, then 2 and 3 repeat, so
  // every line starts on the colour the one above ended on. Each span paints its own slice of the
  // line gradient: a linear-gradient (kept in --bl-g, drawn as its background-image by screen-only CSS)
  // from the colour at its left edge to the colour at its right edge, clipped to the text, so neighbouring words join without a step. The slice colours are
  // worked out here from the resolved ink, blue and red, so the layout pass runs again on a
  // resize, a late font or a theme change. A browser without background-clip: text keeps the
  // solid per-word colour of the sd-bl-* classes (--bl-a mixes two tokens).
  var bl = { words: [], timer: null };
  function enterBeeline() {
    var wordRe = /\S+/g;
    proseNodes(PROSE, SKIP).forEach(function (node) {
      var block = node.parentElement.closest(PROSE), text = node.nodeValue;
      var frag = document.createDocumentFragment(), at = 0, m;
      wordRe.lastIndex = 0;
      while ((m = wordRe.exec(text))) {
        if (m.index > at) frag.appendChild(textNode(text.slice(at, m.index)));
        var w = el("span", "sd-bl-w", m[0]);
        frag.appendChild(w);
        bl.words.push({ el: w, block: block });
        at = m.index + m[0].length;
      }
      if (at < text.length) frag.appendChild(textNode(text.slice(at)));
      replaceNode(node, frag);
    });
    layoutBeeline();
  }
  // a computed colour as [r, g, b] in 0..255, or null (rgb() and color(srgb ...) are what browsers return)
  function parseRgb(c) {
    var m = /^rgba?\(\s*([\d.]+)[, ]+([\d.]+)[, ]+([\d.]+)/.exec(c) || /^color\(srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/.exec(c);
    if (!m) return null;
    var k = c.indexOf("color(") === 0 ? 255 : 1;
    return [m[1] * k, m[2] * k, m[3] * k];
  }
  function mixRgb(a, b, t) {
    return "rgb(" + [0, 1, 2].map(function (i) { return (a[i] + (b[i] - a[i]) * t).toFixed(1); }).join(", ") + ")";
  }
  // the colour stops of line n: line 0 ink to blue, odd lines blue, ink, red, even lines red, ink, blue
  function beeStops(lineNo, ink, blue, red) {
    if (lineNo === 0) return [ink, blue];
    return lineNo % 2 ? [blue, ink, red] : [red, ink, blue];
  }
  function beeAt(stops, t) {
    var segs = stops.length - 1, pos = Math.min(Math.max(t, 0), 1) * segs, i = Math.min(Math.floor(pos), segs - 1);
    return mixRgb(stops[i], stops[i + 1], pos - i);
  }
  // linear-gradient for the slice [t0, t1] of a line; a stop that falls inside the slice is kept
  function beeSlice(stops, t0, t1) {
    var segs = stops.length - 1, parts = [beeAt(stops, t0)], i;
    if (t1 > t0) {
      for (i = 1; i < segs; i++) {
        var edge = i / segs;
        if (edge > t0 && edge < t1) parts.push(beeAt(stops, edge) + " " + (((edge - t0) / (t1 - t0)) * 100).toFixed(2) + "%");
      }
    }
    parts.push(beeAt(stops, t1));
    return "linear-gradient(to right, " + parts.join(", ") + ")";
  }
  function paintBeeLine(from, to, lineNo, lefts, rights, inks, pal) {
    var lo = Infinity, hi = -Infinity, edgeHi = -Infinity, k;
    for (k = from; k <= to; k++) { lo = Math.min(lo, lefts[k]); hi = Math.max(hi, lefts[k]); edgeHi = Math.max(edgeHi, rights[k]); }
    for (k = from; k <= to; k++) {
      var t = hi > lo ? (lefts[k] - lo) / (hi - lo) : 0, cls, a, wordEl = bl.words[k].el;
      if (lineNo === 0) { cls = "bi"; a = t; }
      else if (t < 0.5) { cls = lineNo % 2 ? "ib" : "ir"; a = t * 2; }
      else { cls = lineNo % 2 ? "ri" : "bi"; a = t * 2 - 1; }
      wordEl.className = "sd-bl-w sd-bl-" + cls; // the solid colour, kept as the fallback
      wordEl.style.setProperty("--bl-a", (a * 100).toFixed(1) + "%");
      if (!pal || !inks[k] || !(edgeHi > lo)) { wordEl.style.removeProperty("--bl-g"); continue; }
      var stops = beeStops(lineNo, inks[k], pal.blue, pal.red), span = edgeHi - lo;
      // the slice ends where the next word starts when only a space lies between, so neighbours meet exactly
      var next = k < to && lefts[k + 1] - rights[k] <= bl.words[k].h * 0.5 ? lefts[k + 1] : rights[k];
      wordEl.style.setProperty("--bl-g", beeSlice(stops, (lefts[k] - lo) / span, (next - lo) / span));
      wordEl.className += " sd-bl-g";
    }
  }
  function layoutBeeline() {
    var words = bl.words, n = words.length, tops = new Array(n), lefts = new Array(n), rights = new Array(n), inks = new Array(n), i;
    // reads first, writes after: the palette, then every word's box and the ink it inherits
    var probe = document.createElement("span"), pal = null, blue, red;
    probe.style.display = "none";
    document.body.appendChild(probe);
    probe.style.color = "var(--sd-bl-blue)"; blue = parseRgb(getComputedStyle(probe).color);
    probe.style.color = "var(--sd-bl-red)"; red = parseRgb(getComputedStyle(probe).color);
    document.body.removeChild(probe);
    if (blue && red) pal = { blue: blue, red: red };
    var lastParent = null, lastInk = null;
    for (i = 0; i < n; i++) {
      var w = words[i].el, parent = w.parentElement;
      tops[i] = w.offsetTop; lefts[i] = w.offsetLeft; rights[i] = w.offsetLeft + w.offsetWidth; words[i].h = w.offsetHeight;
      if (parent !== lastParent) { lastParent = parent; lastInk = parseRgb(getComputedStyle(parent).color); }
      inks[i] = lastInk;
    }
    var first = 0, lineNo = 0, lineTop = n ? tops[0] : 0;
    for (i = 1; i <= n; i++) {
      var newBlock = i < n && words[i].block !== words[i - 1].block;
      var newLine = i < n && Math.abs(tops[i] - lineTop) > Math.max(3, words[i].el.offsetHeight / 2);
      if (i < n && !newBlock && !newLine) continue;
      paintBeeLine(first, i - 1, lineNo, lefts, rights, inks, pal);
      first = i;
      lineNo = newBlock ? 0 : lineNo + 1;
      if (i < n) lineTop = tops[i];
    }
  }
  function scheduleBeeline() {
    if (readMode() !== "beeline") return;
    clearTimeout(bl.timer);
    bl.timer = setTimeout(layoutBeeline, 150);
  }

  // ---- RSVP: one word at a time in a full-screen overlay ----
  // The words come from the prose walk. The recognition letter (about 35% into the word) is red and
  // sits on the centre marker: the word is a three-column grid, so the middle column is always the
  // centre of the stage. Sentence ends and block ends pause longer. Space plays and pauses, left
  // and right step, up and down change the speed, Esc closes the overlay and leaves the mode.
  var WPM_KEY = "sd-rsvp-wpm", WPM_MIN = 150, WPM_MAX = 700, WPM_STEP = 25;
  var rs = { words: [], i: 0, playing: false, timer: null, wpm: 300, ui: null, prevFocus: null };
  try {
    var savedWpm = parseInt(localStorage.getItem(WPM_KEY), 10);
    if (!isNaN(savedWpm)) rs.wpm = Math.max(WPM_MIN, Math.min(WPM_MAX, savedWpm));
  } catch (e) {}
  var LETTER_RE;
  try { LETTER_RE = new RegExp("[\\p{L}\\p{N}]", "u"); } catch (e) { LETTER_RE = /\w/; }

  function rsvpPause(word, blockEnd) {
    if (blockEnd || /[.!?\u2026]["'\u201d\u2019)\]]*$/.test(word)) return 2.5;
    return /[,;:]["'\u201d\u2019)\]]*$/.test(word) ? 1.6 : 1;
  }
  function rsvpInView(block) {
    var r = block.getBoundingClientRect();
    return r.bottom > 48 && r.top < window.innerHeight; // 48px is the chrome lane at the top
  }
  function rsvpSplit(word) {
    var chars = Array.from(word.normalize("NFC")), lead = 0, end = chars.length;
    while (lead < end - 1 && !LETTER_RE.test(chars[lead])) lead++;
    while (end - 1 > lead && !LETTER_RE.test(chars[end - 1])) end--;
    var orp = lead + Math.floor((end - lead) * 0.35);
    return [chars.slice(0, orp).join(""), chars[orp], chars.slice(orp + 1).join("")];
  }
  function rsvpShow(i) {
    rs.i = i;
    var ui = rs.ui, w = rs.words[i], parts = rsvpSplit(w.text);
    ui.left.textContent = parts[0];
    ui.mid.textContent = parts[1];
    ui.right.textContent = parts[2];
    ui.pos.textContent = (i + 1) + " / " + rs.words.length;
    ui.fill.style.width = ((i + 1) / rs.words.length * 100).toFixed(1) + "%";
  }
  function rsvpSetPlaying(on) {
    rs.playing = on && rs.words.length > 0;
    clearTimeout(rs.timer);
    rs.timer = null;
    if (rs.playing) rs.timer = setTimeout(rsvpTick, 60000 / rs.wpm * rs.words[rs.i].pause);
    if (!rs.ui) return;
    rs.ui.play.innerHTML = rs.playing ? ICONS.pause : ICONS.play;
    rs.ui.play.setAttribute("aria-label", rs.playing ? "Pause" : "Play");
    rs.ui.play.title = (rs.playing ? "Pause" : "Play") + " (Space)";
  }
  function rsvpTick() {
    if (rs.i >= rs.words.length - 1) { rsvpSetPlaying(false); return; }
    rsvpShow(rs.i + 1);
    rsvpSetPlaying(true);
  }
  function rsvpStep(d) {
    if (!rs.words.length) return;
    rsvpShow(Math.max(0, Math.min(rs.words.length - 1, rs.i + d)));
    if (rs.playing) rsvpSetPlaying(true); // restart the timer so the new word gets its full time
  }
  function rsvpTogglePlay() {
    if (!rs.playing && rs.i >= rs.words.length - 1 && rs.words.length) rsvpShow(0);
    rsvpSetPlaying(!rs.playing);
  }
  function rsvpSpeed(d) {
    rs.wpm = Math.max(WPM_MIN, Math.min(WPM_MAX, rs.wpm + d));
    if (rs.ui) rs.ui.wpm.textContent = rs.wpm + " wpm";
    try { localStorage.setItem(WPM_KEY, String(rs.wpm)); } catch (e) {}
  }
  function rsvpOpen() { return !!rs.ui; }
  // Returns true when the key was ours, so the page-level shortcuts stay quiet while the overlay is up.
  function rsvpKey(e) {
    if (e.key === "Escape" || e.key === "s" || e.key === "S") { applyReadMode("", true); return true; }
    if (e.key === " ") { rsvpTogglePlay(); return true; }
    if (e.key === "ArrowRight") { rsvpStep(1); return true; }
    if (e.key === "ArrowLeft") { rsvpStep(-1); return true; }
    if (e.key === "ArrowUp") { rsvpSpeed(WPM_STEP); return true; }
    if (e.key === "ArrowDown") { rsvpSpeed(-WPM_STEP); return true; }
    if (e.key === "Tab") { // keep focus inside the overlay
      var items = rs.ui.root.querySelectorAll("button"), firstBtn = items[0], lastBtn = items[items.length - 1];
      if (e.shiftKey && document.activeElement === firstBtn) { lastBtn.focus(); return true; }
      if (!e.shiftKey && document.activeElement === lastBtn) { firstBtn.focus(); return true; }
    }
    return false;
  }
  function openRsvp() {
    var groups = [], last = null;
    proseNodes(READ_BLOCK, READ_SKIP).forEach(function (node) {
      var block = node.parentElement.closest(READ_BLOCK);
      if (!last || last.block !== block) groups.push(last = { block: block, text: "" });
      last.text += node.nodeValue;
    });
    rs.words = [];
    var startAt = -1;
    groups.forEach(function (g) {
      var parts = g.text.split(/\s+/).filter(Boolean);
      if (startAt < 0 && parts.length && rsvpInView(g.block)) startAt = rs.words.length;
      parts.forEach(function (w, k) { rs.words.push({ text: w, pause: rsvpPause(w, k === parts.length - 1) }); });
    });

    var root = el("div", "sd-rsvp-overlay");
    root.setAttribute("role", "dialog");
    root.setAttribute("aria-modal", "true");
    root.setAttribute("aria-label", "RSVP reader");
    var stage = el("div", "sd-rsvp-stage"), word = el("div", "sd-rsvp-word");
    var left = el("span", "sd-rsvp-l"), mid = el("span", "sd-rsvp-o"), right = el("span", "sd-rsvp-r");
    word.appendChild(left); word.appendChild(mid); word.appendChild(right);
    stage.appendChild(word);
    var bar = el("div", "sd-rsvp-bar");
    bar.setAttribute("role", "group");
    bar.setAttribute("aria-label", "Reader controls");
    function ctl(svg, label, title, fn) {
      var b = el("button", "sd-rsvp-btn");
      b.type = "button"; b.innerHTML = svg;
      b.setAttribute("aria-label", label); b.title = title;
      b.addEventListener("click", fn);
      bar.appendChild(b);
      return b;
    }
    ctl(ICONS.back, "Previous word", "Previous word (Left)", function () { rsvpStep(-1); });
    var play = ctl(ICONS.play, "Play", "Play (Space)", rsvpTogglePlay);
    ctl(ICONS.forward, "Next word", "Next word (Right)", function () { rsvpStep(1); });
    bar.appendChild(el("span", "sd-sep")).setAttribute("aria-hidden", "true");
    ctl(ICONS.minus, "Slower", "Slower (Down)", function () { rsvpSpeed(-WPM_STEP); });
    var wpm = el("span", "sd-rsvp-wpm");
    wpm.setAttribute("aria-live", "polite");
    bar.appendChild(wpm);
    ctl(ICONS.plus, "Faster", "Faster (Up)", function () { rsvpSpeed(WPM_STEP); });
    bar.appendChild(el("span", "sd-sep")).setAttribute("aria-hidden", "true");
    ctl(ICONS.close, "Close reader", "Close (Esc)", function () { applyReadMode("", true); });
    var track = el("div", "sd-rsvp-track"), fill = el("div", "sd-rsvp-fill"), pos = el("div", "sd-rsvp-pos");
    track.setAttribute("aria-hidden", "true");
    track.appendChild(fill);
    var hint = el("div", "sd-rsvp-hint", "Space plays or pauses. Left and right step. Up and down change the speed. Esc closes.");
    root.appendChild(stage); root.appendChild(bar); root.appendChild(pos); root.appendChild(track); root.appendChild(hint);

    root.addEventListener("keyup", function (e) { if (e.key === " ") e.preventDefault(); }); // Space must not also click a focused button
    rs.ui = { root: root, left: left, mid: mid, right: right, play: play, wpm: wpm, pos: pos, fill: fill };
    rs.prevFocus = readTrigger || document.activeElement;
    document.body.appendChild(root);
    rsvpSpeed(0);
    if (!rs.words.length) {
      left.textContent = "Nothing to read";
      play.disabled = true;
    } else {
      rsvpShow(startAt < 0 ? 0 : startAt);
      rsvpSetPlaying(true);
    }
    play.focus();
  }
  function closeRsvp() {
    clearTimeout(rs.timer);
    rs.timer = null;
    rs.playing = false;
    if (rs.ui && rs.ui.root.parentNode) rs.ui.root.parentNode.removeChild(rs.ui.root);
    rs.ui = null;
    rs.words = [];
    var back = rs.prevFocus;
    rs.prevFocus = null;
    if (back && back !== document.body && document.contains(back) && back.focus) back.focus();
  }

  // ---- copy-source (raw markdown, base64-embedded for UTF-8 + file:// safety) ----
  function decodeSrc() {
    var el = document.getElementById("sd-src");
    if (!el) return "";
    var b64 = el.textContent.replace(/\s+/g, "");
    try {
      var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      return new TextDecoder("utf-8").decode(bytes);
    } catch (e) { return ""; }
  }
  function flashDone(btn) {
    btn.innerHTML = ICONS.check; btn.classList.add("sd-done");
    btn.setAttribute("aria-label", "Copied"); btn.title = "Copied";
    setTimeout(function () {
      btn.innerHTML = ICONS.copy; btn.classList.remove("sd-done");
      btn.setAttribute("aria-label", COPY_LABEL); btn.title = COPY_LABEL;
    }, 1500);
  }
  function legacyCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
  function copySource(btn) {
    var md = decodeSrc();
    var done = function () { flashDone(btn); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(done, function () { legacyCopy(md, done); });
    } else {
      legacyCopy(md, done);
    }
  }

  // ---- the Read menu: Off + each mode, one checked ----
  // A menu button (aria-haspopup) opens a popover holding a role=menu of radio items, and under it the
  // Skim settings while Skim is on. Arrow keys, Home and End move over the items, Enter and Space pick,
  // Esc closes and gives focus back to the button. Tab walks on into the settings, and out closes the popover.
  function buildReadMenu() {
    var wrap = el("div", "sd-read-wrap"), pop = el("div", "sd-read-pop"), menu = el("div", "sd-read-menu");
    pop.id = "sd-read-pop";
    pop.hidden = true;
    menu.id = "sd-read-menu";
    menu.setAttribute("role", "menu");
    menu.setAttribute("aria-label", "Reading mode");
    readTrigger = el("button", "sd-read");
    readTrigger.type = "button";
    readTrigger.innerHTML = ICONS.read;
    readTrigger.setAttribute("aria-haspopup", "menu");
    readTrigger.setAttribute("aria-expanded", "false");
    readTrigger.setAttribute("aria-controls", menu.id);
    updateReadTrigger();
    var list = ["off"].concat(READ_MODES.filter(modeAvailable)), buttons = [];
    list.forEach(function (m) {
      var item = el("button", "sd-read-item", m === "off" ? "Off" : MODE_LABELS[m]);
      item.type = "button";
      item.setAttribute("role", "menuitemradio");
      item.setAttribute("aria-checked", String(m === "off" ? !readMode() : readMode() === m));
      item.tabIndex = -1;
      if (m !== "off") item.title = MODE_LABELS[m] + ": " + MODE_HINTS[m];
      item.addEventListener("click", function () {
        closeMenu(false);
        applyReadMode(m === "off" ? "" : m, true);
        if (m !== "rsvp") readTrigger.focus();
      });
      readItems[m] = item;
      buttons.push(item);
      menu.appendChild(item);
    });
    function isOpen() { return !pop.hidden; }
    function focusItem(i) { buttons[(i + buttons.length) % buttons.length].focus(); }
    function openMenu() {
      pop.hidden = false;
      readTrigger.setAttribute("aria-expanded", "true");
      var at = 0;
      buttons.forEach(function (b, i) { if (b.getAttribute("aria-checked") === "true") at = i; });
      focusItem(at);
    }
    function closeMenu(refocus) {
      pop.hidden = true;
      readTrigger.setAttribute("aria-expanded", "false");
      if (refocus) readTrigger.focus();
    }
    readTrigger.addEventListener("click", function () { if (isOpen()) closeMenu(false); else openMenu(); });
    wrap.addEventListener("keydown", function (e) {
      var at = buttons.indexOf(document.activeElement);
      if (e.key === "Escape" && isOpen()) { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
      else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && (at >= 0 || document.activeElement === readTrigger)) {
        e.preventDefault();
        if (!isOpen()) openMenu(); else focusItem(at + (e.key === "ArrowDown" ? 1 : -1));
      }
      else if (isOpen() && at >= 0 && e.key === "Home") { e.preventDefault(); focusItem(0); }
      else if (isOpen() && at >= 0 && e.key === "End") { e.preventDefault(); focusItem(buttons.length - 1); }
      else if (isOpen() && e.key === "Tab") setTimeout(function () { if (!wrap.contains(document.activeElement)) closeMenu(false); }, 0);
    });
    document.addEventListener("click", function (e) { if (isOpen() && !wrap.contains(e.target)) closeMenu(false); });
    pop.appendChild(menu);
    pop.appendChild(buildSkimPanel());
    wrap.appendChild(readTrigger);
    wrap.appendChild(pop);
    return wrap;
  }

  // ---- build toolbar ----
  // Every control is a real button with an aria-label and a title tooltip.
  function btn(cls, svg, label, title, fn) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls; b.innerHTML = svg;
    b.setAttribute("aria-label", label); b.title = title;
    b.addEventListener("click", function () { fn(b); });
    return b;
  }
  var bar = document.createElement("div");
  bar.className = "sd-toolbar";
  bar.setAttribute("role", "toolbar");
  bar.setAttribute("aria-label", "Reading tools");
  bar.appendChild(btn("sd-zoom-out", ICONS.zoomOut, "Zoom out", "Zoom out (Cmd -)", zoomOut));
  pctEl = btn("sd-zoom-pct", "", "Reset zoom", "Reset zoom (Cmd 0)", zoomReset);
  bar.appendChild(pctEl);
  bar.appendChild(btn("sd-zoom-in", ICONS.zoomIn, "Zoom in", "Zoom in (Cmd +)", zoomIn));
  var sep = document.createElement("span"); sep.className = "sd-sep";
  sep.setAttribute("aria-hidden", "true");
  bar.appendChild(sep);
  bar.appendChild(buildReadMenu());
  bar.appendChild(btn("sd-copy", ICONS.copy, COPY_LABEL, "Copy the raw markdown to the clipboard", copySource));
  bar.appendChild(btn("sd-print", ICONS.print, "Print", "Print this page", function () { window.print(); }));
  document.body.appendChild(bar);

  // ---- reading progress: a 2px bar at the top, scaled to how far down the page we are ----
  var progress = document.createElement("div");
  progress.className = "sd-progress";
  progress.setAttribute("aria-hidden", "true");
  document.body.appendChild(progress);
  var progressQueued = false;
  function paintProgress() {
    progressQueued = false;
    var max = doc.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, (window.pageYOffset || doc.scrollTop) / max)) : 0;
    progress.style.transform = "scaleX(" + p.toFixed(4) + ")";
  }
  function queueProgress() {
    if (progressQueued) return;
    progressQueued = true;
    requestAnimationFrame(paintProgress);
  }
  window.addEventListener("scroll", queueProgress, { passive: true });
  window.addEventListener("resize", queueProgress);
  paintProgress();

  apply(); // sets --sd-zoom + the pct label from saved/default
  applyReadMode(savedMode, false); // the saved mode, now that the text and the toolbar are final
  // BeeLine follows the line breaks: window size, the outline opening or closing, late web fonts, a theme switch.
  window.addEventListener("resize", scheduleBeeline);
  if (window.ResizeObserver) new ResizeObserver(scheduleBeeline).observe(document.body);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleBeeline);
  var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
  if (darkQuery.addEventListener) darkQuery.addEventListener("change", scheduleBeeline);

  // ---- keyboard: Cmd/Ctrl +/-/0 (override the browser's own page zoom), plus the single-key shortcuts ----
  window.addEventListener("keydown", function (e) {
    // while the RSVP overlay is up it owns the plain keys
    if (rsvpOpen() && !e.metaKey && !e.ctrlKey && !e.altKey && rsvpKey(e)) { e.preventDefault(); return; }
    // outline toggle: bare "[", ignored when modified or while typing in an editable
    if (e.key === "[" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var ae = document.activeElement;
      var editable = ae && (ae.isContentEditable ||
        /^(input|textarea|select)$/i.test(ae.tagName));
      if (!editable && doc.classList.contains("sd-has-toc")) {
        e.preventDefault(); toggleToc(); return;
      }
    }
    // reading mode toggle: bare "s" turns the last-used mode on or off, same guards as "["
    if ((e.key === "s" || e.key === "S") && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var se = document.activeElement;
      var typing = se && (se.isContentEditable || /^(input|textarea|select)$/i.test(se.tagName));
      if (!typing) { e.preventDefault(); toggleLastMode(); return; }
    }
    if (!(e.metaKey || e.ctrlKey)) return;
    if (e.key === "=" || e.key === "+") { e.preventDefault(); zoomIn(); }
    else if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomOut(); }
    else if (e.key === "0") { e.preventDefault(); zoomReset(); }
  });

  // ---- scroll-spy: highlight the section currently in view ----
  if (doc.classList.contains("sd-has-toc")) {
    var links = {};
    toc.querySelectorAll('a[href^="#"]').forEach(function (a) {
      var id = decodeURIComponent(a.getAttribute("href").slice(1));
      if (id) links[id] = a;
    });
    var heads = Object.keys(links)
      .map(function (id) { return document.getElementById(id); })
      .filter(Boolean);
    // Keep the active outline item in view inside the sidebar's own scroll, without moving the page.
    var TOC_HEAD = 44;
    function revealInOutline(a) {
      var top = a.offsetTop, bottom = top + a.offsetHeight;
      if (top < toc.scrollTop + TOC_HEAD + 8) toc.scrollTop = Math.max(0, top - TOC_HEAD - 8);
      else if (bottom > toc.scrollTop + toc.clientHeight - 12) toc.scrollTop = bottom - toc.clientHeight + 12;
    }
    if ("IntersectionObserver" in window && heads.length) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          var a = links[en.target.id];
          if (!a) return;
          for (var k in links) links[k].classList.remove("sd-active");
          a.classList.add("sd-active");
          revealInOutline(a);
        });
      }, { rootMargin: "0px 0px -75% 0px", threshold: 0 });
      heads.forEach(function (h) { io.observe(h); });
    }
  }

  // ---- frontmatter "Show more": clamp long values, reveal on demand ----
  // CSS line-clamps .sd-fm-clamp to a few lines. Only add a toggle when the value actually
  // overflows the clamp (so a value that fits gets no button).
  document.querySelectorAll("td.sd-fm-long").forEach(function (td) {
    var clamp = td.querySelector(".sd-fm-clamp");
    if (!clamp) return;
    if (clamp.scrollHeight - clamp.clientHeight < 4) return; // fits within the clamp, no toggle
    var btn = document.createElement("button");
    btn.className = "sd-fm-more";
    btn.textContent = "Show more";
    btn.setAttribute("aria-expanded", "false");
    btn.addEventListener("click", function () {
      var open = td.classList.toggle("sd-fm-expanded");
      btn.textContent = open ? "Show less" : "Show more";
      btn.setAttribute("aria-expanded", String(open));
    });
    td.appendChild(btn);
  });
})();
</script>
