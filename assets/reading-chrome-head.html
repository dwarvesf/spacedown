<style>
/* spacedown reading chrome:
   outline sidebar + zoom + copy-source toolbar. Injected AFTER the base VS Code
   stylesheet via pandoc --include-in-header, so it wins. Self-contained, no web fonts.
   The matching JS is assets/reading-chrome-foot.html. */

/* (1) Zoom: scale body text AND line-height by the same factor so the VS Code
   font/line ratio (14px / 22px) is preserved at every stop. JS sets --sd-zoom
   (1 = 100%). !important beats the base `html, body { font-size: var(...) }`,
   which otherwise wins on specificity. Sidebar + toolbar set their own font-size,
   so they are unaffected by the scale. */
body {
  font-size: calc(var(--markdown-font-size, 14px) * var(--sd-zoom, 1)) !important;
  line-height: calc(var(--markdown-line-height, 22px) * var(--sd-zoom, 1)) !important;
}

/* (1b) Chrome colors. Tokens only, so section (6) can flip the whole sidebar and
   toolbar under the dark media query without restating a single rule. Light values
   are the originals. */
:root {
  --sd-chrome-bg: #fafafa;
  --sd-chrome-border: #e5e5e5;
  --sd-chrome-rule: #ececec;
  --sd-chrome-ink: #374151;
  --sd-chrome-ink-muted: #6b7280;
  --sd-chrome-ink-strong: #18181b;
  --sd-chrome-hover: rgba(0, 0, 0, 0.05);
  --sd-chrome-hover-strong: rgba(0, 0, 0, 0.06);
  --sd-chrome-active: rgba(0, 0, 0, 0.07);
  --sd-toolbar-bg: rgba(255, 255, 255, 0.72);
  --sd-toolbar-bg-opaque: #ffffff;
  --sd-toolbar-border: rgba(0, 0, 0, 0.08);
  --sd-toolbar-shadow: rgba(0, 0, 0, 0.08);
  --sd-toolbar-hairline: rgba(0, 0, 0, 0.04);
  --sd-copy-done: #059669;
  --sd-chrome-accent: #1d5fd1;
  --sd-chrome-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

/* (1a) Top chrome lane: reserve vertical space so the fixed toolbar + toggle never float
   over the first heading / first outline link / first body line (Apple-HIG: floating
   controls get a reserved lane, they do not occlude content). One variable, shared by the
   body and the sidebar so the first heading and the first outline link start level. */
:root { --sd-chrome-lane: 48px; }
body { padding-top: var(--sd-chrome-lane); }

/* (2) Outline sidebar. pandoc emits nav#TOC only when the doc has headings; JS adds
   .sd-has-toc to <html> once it confirms real entries, which reveals it and shifts
   the body. A no-heading doc keeps the plain full-width layout. */
nav#TOC {
  position: fixed; top: 0; left: 0; bottom: 0; width: 240px;
  box-sizing: border-box; overflow-y: auto;
  margin: 0; padding: 0 14px 24px;   /* no top padding: the header strip owns the top */
  background: var(--sd-chrome-bg); border-right: 1px solid var(--sd-chrome-border);
  /* Chrome, not reading text: the system UI font at a smaller size, whatever the theme sets. */
  font-family: var(--sd-chrome-font);
  font-size: 12.5px; line-height: 1.45;
  display: none;
}

/* Sidebar header row, the sidebar's own top bar. Sticky at the very top (no negative-margin
   tricks, which previously rendered it BELOW the floating toggle). Holds the "Outline" label
   on the left; the (body-child) hamburger toggle floats into its right edge on the same row. */
nav#TOC .sd-toc-header {
  position: sticky; top: 0; z-index: 1;
  height: 44px; margin: 0 -14px 8px; padding: 0 12px;
  display: flex; align-items: center;
  background: var(--sd-chrome-bg); border-bottom: 1px solid var(--sd-chrome-rule);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--sd-chrome-ink-muted);
}
nav#TOC .sd-toc-header::before { content: "Outline"; }
nav#TOC ul { list-style: none; margin: 0; padding-left: 0; }
nav#TOC li { margin: 1px 0; }
/* Nested headings (h3 under h2) step in under a hairline guide, so the outline reads as a tree. */
nav#TOC li > ul { margin: 1px 0 3px 10px; padding-left: 6px; border-left: 1px solid var(--sd-chrome-rule); }
nav#TOC a {
  display: block; padding: 3px 8px 3px 10px; border-radius: 0 5px 5px 0;
  border-left: 2px solid transparent;
  color: var(--sd-chrome-ink); text-decoration: none; background: transparent;
}
nav#TOC a:hover { background: var(--sd-chrome-hover); color: var(--sd-chrome-ink-strong); }
nav#TOC a:focus-visible { outline: 2px solid var(--sd-chrome-accent); outline-offset: -2px; }
/* Active item: a 2px accent bar on the left edge and bold text, no fill. */
nav#TOC a.sd-active { border-left-color: var(--sd-chrome-accent); color: var(--sd-chrome-ink-strong); font-weight: 700; }

html.sd-has-toc nav#TOC { display: block; }
html.sd-has-toc body { padding-left: 280px; }

/* Reading progress: a 2px bar across the very top, scaled by the JS as the page scrolls. */
.sd-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 1002;
  background: var(--sd-chrome-ink-strong);
  transform: scaleX(0); transform-origin: 0 50%;
  pointer-events: none;
}

/* (3) Toolbar (zoom, copy-source, print), fixed top-right, built by JS. Explicit font-size
   so the body zoom scale does not grow the controls. */
.sd-toolbar {
  position: fixed; top: 10px; right: 14px; z-index: 1000;
  display: flex; align-items: center; gap: 4px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  /* Apple translucent material: floats over content without an opaque slab. */
  background: var(--sd-toolbar-bg);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--sd-toolbar-border); border-radius: 8px;
  padding: 4px 6px;
  box-shadow: 0 1px 3px var(--sd-toolbar-shadow), 0 0 0 0.5px var(--sd-toolbar-hairline);
}
/* Engines without backdrop-filter: fall back to opaque white (still readable). */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .sd-toolbar { background: var(--sd-toolbar-bg-opaque); }
}
.sd-toolbar button {
  border: 0; background: transparent; color: var(--sd-chrome-ink); cursor: pointer;
  font-family: inherit; line-height: 1; border-radius: 5px; padding: 0;
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
}
.sd-toolbar button:hover { background: var(--sd-chrome-hover-strong); color: var(--sd-chrome-ink-strong); }
.sd-toolbar button:focus-visible { outline: 2px solid var(--sd-chrome-accent); outline-offset: 1px; }
.sd-toolbar svg { width: 16px; height: 16px; display: block; }
/* The zoom level stays small text: a button that resets the zoom on click. */
.sd-toolbar .sd-zoom-pct {
  width: auto; min-width: 42px; padding: 0 4px;
  font-size: 11px; color: var(--sd-chrome-ink-muted);
  font-variant-numeric: tabular-nums;
}
.sd-toolbar button[aria-pressed="true"] { background: var(--sd-chrome-active); color: var(--sd-chrome-ink-strong); }

.sd-sep { width: 1px; align-self: stretch; background: var(--sd-chrome-border); margin: 4px 2px; }
.sd-toolbar .sd-copy.sd-done { color: var(--sd-copy-done); }

/* (5) Collapsible outline. Strictly downstream of .sd-has-toc. Slide (transform)
   not shrink (width) so the sidebar transition is compositor-only; body padding-left
   animates once per toggle. All transitions gated behind .sd-anim-ready (added on the
   frame after first paint) so the saved/initial state never flashes or animates in. */

/* One fixed hamburger control, reachable in both states: docked at the sidebar header's
   right edge when open, floating in the gutter when collapsed. Same glyph both states. */
.sd-toc-toggle {
  position: fixed; top: 8px; left: 10px; z-index: 1001;  /* top:8 -> vertically centered in the 44px header row */
  width: 28px; height: 28px; padding: 0;
  display: none;                    /* revealed only with .sd-has-toc, like the sidebar */
  align-items: center; justify-content: center;
  border: 1px solid var(--sd-chrome-border); border-radius: 6px;
  background: var(--sd-toolbar-bg-opaque); color: var(--sd-chrome-ink); cursor: pointer;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 16px; line-height: 1;
  box-shadow: 0 1px 3px var(--sd-toolbar-shadow);
}
.sd-toc-toggle:hover { background: var(--sd-chrome-hover-strong); }
.sd-toc-toggle::before { content: "\2630"; }   /* hamburger: a single toggle affordance, both states */
html.sd-has-toc .sd-toc-toggle { display: flex; }

/* EXPANDED: dock the chevron into the sidebar header strip (right edge of the 240px
   sidebar: 240 - 28 btn - 10 gutter = 202). It stays a <body> child (NOT reparented under
   nav#TOC) so the sidebar's transform/visibility on collapse never traps it. Transparent
   chrome: it sits inside the opaque #fafafa header strip, so no pill. */
html.sd-has-toc:not(.sd-toc-collapsed) .sd-toc-toggle {
  left: 202px;
  background: transparent; border-color: transparent; box-shadow: none;
}
html.sd-has-toc:not(.sd-toc-collapsed) .sd-toc-toggle:hover {
  background: var(--sd-chrome-hover-strong); border-color: var(--sd-chrome-border);
}

/* COLLAPSED: float the chevron in the reclaimed left gutter, as Apple translucent
   material to match the toolbar (it now floats over body content, not the sidebar). */
html.sd-has-toc.sd-toc-collapsed .sd-toc-toggle {
  left: 10px;
  background: var(--sd-toolbar-bg);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--sd-toolbar-border);
}

/* Collapsed: slide sidebar off-canvas, reclaim body width, drop links from tab order. */
html.sd-has-toc.sd-toc-collapsed nav#TOC {
  transform: translateX(-100%); opacity: 0;
  pointer-events: none; visibility: hidden;
}
html.sd-has-toc.sd-toc-collapsed body { padding-left: 26px; }
/* Phones: html and body each pad 26px, so text sat 52px in from each edge. Drop the html pad and give
   body one 20px gutter; an open outline overlays the text here instead of pushing it. */
@media (max-width: 600px) {
  html { padding-left: 0; padding-right: 0; }
  body, html.sd-has-toc body, html.sd-has-toc.sd-toc-collapsed body { padding-left: 20px; padding-right: 20px; }
  /* A table wider than a phone column scrolls in its own box instead of pushing the page sideways. */
  body > table:not(.sd-frontmatter) { display: block; overflow-x: auto; max-width: 100%; }
}

/* Transitions live only after first paint. visibility flips after the slide on collapse
   (so links leave the tab order only once hidden), immediately on expand. */
html.sd-anim-ready.sd-has-toc nav#TOC {
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1),
              opacity 200ms cubic-bezier(0.4, 0, 0.2, 1),
              visibility 0s linear 200ms;
}
html.sd-anim-ready.sd-has-toc:not(.sd-toc-collapsed) nav#TOC {
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1),
              opacity 200ms cubic-bezier(0.4, 0, 0.2, 1),
              visibility 0s linear 0s;
}
html.sd-anim-ready.sd-has-toc body {
  transition: padding-left 200ms cubic-bezier(0.4, 0, 0.2, 1);
}
/* Slide the chevron between its docked (202px) and gutter (10px) spots in step with
   the sidebar. Gated behind anim-ready so the initial state never animates in. */
html.sd-anim-ready.sd-has-toc .sd-toc-toggle {
  transition: left 200ms cubic-bezier(0.4, 0, 0.2, 1),
              background 200ms, border-color 200ms, box-shadow 200ms;
}


/* (6) Dark appearance. Follows the OS/browser setting, matching the page itself.
   Tokens only: an unflipped sidebar would glow white against the dark page. */
@media (prefers-color-scheme: dark) {
  :root {
    --sd-chrome-bg: #282b31;
    --sd-chrome-border: #3c404a;
    --sd-chrome-rule: #383c44;
    --sd-chrome-ink: #c8c8d0;
    --sd-chrome-ink-muted: #9a9aa2;
    --sd-chrome-ink-strong: #f2f2f4;
    --sd-chrome-hover: rgba(255, 255, 255, 0.07);
    --sd-chrome-hover-strong: rgba(255, 255, 255, 0.09);
    --sd-chrome-active: rgba(255, 255, 255, 0.12);
    --sd-toolbar-bg: rgba(50, 54, 62, 0.72);
    --sd-toolbar-bg-opaque: #32363e;
    --sd-toolbar-border: rgba(255, 255, 255, 0.12);
    --sd-toolbar-shadow: rgba(0, 0, 0, 0.5);
    --sd-toolbar-hairline: rgba(255, 255, 255, 0.06);
    --sd-copy-done: #5ec99a;
    --sd-chrome-accent: #7aa7ff;
  }
}

/* (7) Skim reading mode. The Read menu puts html.sd-skim on the page (the JS keeps one
   data-sd-read-mode value and one matching sd-<mode> class, so each mode adds its own block and
   never stacks). Skim scores the prose and wraps the words that move away from the middle in
   span.sd-sk[data-sk]: -2 and -1 are the predictable ones, 1 and 2 the surprising ones. Level 0 is
   plain text and has no span. html[data-sd-skim] is a token list of the emphasis styles in force
   (dim, heat, underline), and ~= makes any mix the union of the rules below. The values are skimgram's
   own: opacity and an alpha-only red work on a light and a dark ground alike, so no theme token is
   needed. How much of the page is marked is the intensity setting, which moves the levels, not these
   values. Screen only: print always renders the normal view. */
@media screen {
  html.sd-skim .sd-sk { display: inline; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  html[data-sd-skim~="heat"] .sd-sk[data-sk="1"] { background: rgba(255, 71, 64, 0.18); border-radius: 2px; }
  html[data-sd-skim~="heat"] .sd-sk[data-sk="2"] { background: rgba(255, 71, 64, 0.42); border-radius: 2px; }
  html[data-sd-skim~="underline"] .sd-sk[data-sk="1"] { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  html[data-sd-skim~="underline"] .sd-sk[data-sk="2"] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; font-weight: 600; }
  /* dim comes last, so its font-weight beats underline's 600 */
  html[data-sd-skim~="dim"] .sd-sk[data-sk="-1"] { opacity: .62; }
  html[data-sd-skim~="dim"] .sd-sk[data-sk="-2"] { opacity: .34; }
  html[data-sd-skim~="dim"] .sd-sk[data-sk="1"] { font-weight: 600; }
  html[data-sd-skim~="dim"] .sd-sk[data-sk="2"] { font-weight: 700; }
}

/* (7b) The Read menu in the toolbar. The button shows the pressed look while any mode is on; the
   popover drops from the toolbar's right edge and holds the menu of modes, then the Skim settings
   while Skim is on. Items beat the 28px toolbar button size by class specificity. The popover is
   part of the toolbar, so print hides it with the rest. */
.sd-toolbar .sd-read.sd-on { background: var(--sd-chrome-active); color: var(--sd-chrome-ink-strong); }
.sd-read-wrap { position: relative; display: inline-flex; }
.sd-read-pop {
  position: absolute; top: calc(100% + 10px); right: -6px; z-index: 1; min-width: 176px;
  background: var(--sd-toolbar-bg-opaque); border: 1px solid var(--sd-toolbar-border); border-radius: 8px;
  box-shadow: 0 4px 14px var(--sd-toolbar-shadow), 0 0 0 0.5px var(--sd-toolbar-hairline);
}
.sd-read-pop[hidden] { display: none; }
.sd-read-menu { display: flex; flex-direction: column; gap: 1px; padding: 4px; }
.sd-toolbar .sd-read-item {
  position: relative; width: 100%; height: auto; padding: 7px 10px 7px 26px;
  justify-content: flex-start; white-space: nowrap; text-align: left;
  font-size: 13px; line-height: 1.2;
}
.sd-toolbar .sd-read-item[aria-checked="true"] { background: var(--sd-chrome-active); color: var(--sd-chrome-ink-strong); }
.sd-toolbar .sd-read-item[aria-checked="true"]::before { content: "\2713"; position: absolute; left: 9px; }
.sd-skim-panel {
  display: flex; flex-direction: column; gap: 10px; min-width: 208px; padding: 10px 12px 12px;
  border-top: 1px solid var(--sd-chrome-rule); font-size: 12px; color: var(--sd-chrome-ink);
}
.sd-skim-panel[hidden] { display: none; }
.sd-sk-row { display: flex; flex-direction: column; gap: 6px; }
.sd-sk-label { display: flex; justify-content: space-between; color: var(--sd-chrome-ink-muted); }
.sd-sk-value { font-variant-numeric: tabular-nums; }
.sd-sk-seg { display: flex; gap: 3px; }
.sd-toolbar .sd-sk-opt {
  flex: 1; width: auto; height: 26px; padding: 0 8px; font-size: 12px;
  border: 1px solid var(--sd-chrome-border); background: transparent;
}
.sd-toolbar .sd-sk-opt[aria-pressed="true"] { border-color: var(--sd-chrome-accent); }
.sd-skim-panel input[type="range"] { width: 100%; margin: 0; accent-color: var(--sd-chrome-accent); }
.sd-skim-panel select {
  font: inherit; padding: 4px 6px; color: var(--sd-chrome-ink); background: var(--sd-toolbar-bg-opaque);
  border: 1px solid var(--sd-chrome-border); border-radius: 5px;
}
.sd-skim-panel select:focus-visible, .sd-skim-panel input:focus-visible { outline: 2px solid var(--sd-chrome-accent); outline-offset: 1px; }

/* (8) The other reading modes, same contract as Skim: one html.sd-<mode> class at a time, colour
   (never opacity), screen only. The JS puts the markup in and takes it out again, so print sees
   the plain page; b.sd-bi is the one rule outside @media screen, and it only undoes the default
   bold of <b>. Themes may set --sd-read-blue, --sd-read-red and --sd-read-bg next to their palette,
   and --sd-skim-ink, the text colour of the RSVP overlay; the -base tokens serve read, mono and
   custom CSS. */
:root {
  --sd-skim-ink-base: var(--vscode-editor-foreground);
  --sd-read-blue-base: #1d5fd1;
  --sd-read-red-base: #b3261e;
  --sd-read-bg-base: var(--vscode-editor-background);
}
@media (prefers-color-scheme: dark) {
  :root { --sd-read-blue-base: #7aa7ff; --sd-read-red-base: #ff8a80; }
}
b.sd-bi { font-weight: inherit; }
@media screen {
  html.sd-bionic b.sd-bi { font-weight: 700; }

  /* BeeLine: --bl-a is how much of the first colour (--bl-x) is mixed over the second (--bl-y). */
  html.sd-beeline {
    --sd-bl-blue: var(--sd-read-blue, var(--sd-read-blue-base));
    --sd-bl-red: var(--sd-read-red, var(--sd-read-red-base));
  }
  html.sd-beeline .sd-bl-w { color: var(--bl-y); color: color-mix(in srgb, var(--bl-x) var(--bl-a, 0%), var(--bl-y)); }
  html.sd-beeline .sd-bl-bi { --bl-x: var(--sd-bl-blue); --bl-y: currentcolor; }
  html.sd-beeline .sd-bl-ib { --bl-x: currentcolor; --bl-y: var(--sd-bl-blue); }
  html.sd-beeline .sd-bl-ri { --bl-x: var(--sd-bl-red); --bl-y: currentcolor; }
  html.sd-beeline .sd-bl-ir { --bl-x: currentcolor; --bl-y: var(--sd-bl-red); }
  /* The word paints its own slice of the line gradient (the JS keeps it in --bl-g, so print never
     sees it): clipped to the glyphs, with the text fill clear, so color stays the ink. */
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    html.sd-beeline .sd-bl-g { background-image: var(--bl-g); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    html.sd-beeline .sd-bl-g::selection { -webkit-text-fill-color: currentcolor; }
  }
  @media (forced-colors: active) {
    html.sd-beeline .sd-bl-g { background-image: none; -webkit-text-fill-color: currentcolor; }
  }

  /* RSVP: a full-screen overlay; the three-column word keeps its middle letter on the centre. */
  html.sd-rsvp body { overflow: hidden; }
  .sd-rsvp-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2000; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px;
    background: var(--sd-read-bg, var(--sd-read-bg-base));
    color: var(--sd-skim-ink, var(--sd-skim-ink-base));
  }
  .sd-rsvp-stage { position: relative; box-sizing: border-box; width: 100%; max-width: var(--sd-measure); padding: 36px 0; }
  .sd-rsvp-stage::before, .sd-rsvp-stage::after {
    content: ""; position: absolute; left: 50%; width: 2px; height: 14px; margin-left: -1px;
    background: var(--sd-chrome-ink-muted);
  }
  .sd-rsvp-stage::before { top: 0; }
  .sd-rsvp-stage::after { bottom: 0; }
  .sd-rsvp-word {
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: baseline;
    white-space: pre; line-height: 1.3; font-size: clamp(34px, 8vw, 76px);
  }
  .sd-rsvp-l { justify-self: end; text-align: right; }
  .sd-rsvp-o { color: var(--sd-read-red, var(--sd-read-red-base)); }
  .sd-rsvp-r { justify-self: start; }
  .sd-rsvp-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px;
    margin-top: 28px; font-family: var(--sd-chrome-font); font-size: 13px;
  }
  .sd-rsvp-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
    border: 1px solid var(--sd-chrome-border); border-radius: 8px; cursor: pointer;
    background: var(--sd-toolbar-bg-opaque); color: var(--sd-chrome-ink);
  }
  .sd-rsvp-btn:hover:not(:disabled) { background: var(--sd-chrome-hover-strong); color: var(--sd-chrome-ink-strong); }
  .sd-rsvp-btn:focus-visible { outline: 2px solid var(--sd-chrome-accent); outline-offset: 1px; }
  .sd-rsvp-btn:disabled { cursor: default; color: var(--sd-chrome-ink-muted); }
  .sd-rsvp-btn svg { width: 18px; height: 18px; display: block; }
  .sd-rsvp-bar .sd-sep { margin: 4px 6px; height: 20px; align-self: auto; }
  .sd-rsvp-wpm { min-width: 66px; text-align: center; color: var(--sd-chrome-ink); font-variant-numeric: tabular-nums; }
  .sd-rsvp-pos { margin-top: 20px; font-family: var(--sd-chrome-font); font-size: 12px; color: var(--sd-chrome-ink-muted); font-variant-numeric: tabular-nums; }
  .sd-rsvp-track { width: min(24rem, 80%); height: 2px; margin-top: 8px; background: var(--sd-chrome-border); }
  .sd-rsvp-fill { width: 0; height: 100%; background: var(--sd-chrome-ink-strong); }
  .sd-rsvp-hint { margin-top: 24px; font-family: var(--sd-chrome-font); font-size: 12px; color: var(--sd-chrome-ink-muted); text-align: center; }
}
@media print { .sd-rsvp-overlay { display: none !important; } }

/* (4) Print: drop the chrome (sidebar, toolbar, toggle, progress bar), print black on white
   at full width with page margins, and keep tables, figures, code and quotes whole. */
@media print {
  @page { margin: 18mm 16mm; }
