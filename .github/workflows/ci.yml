name: CI

# This repo is public, so GitHub-hosted macOS runners are free here. Never move
# these jobs to a self-hosted runner: a fork PR would run on that machine.
# What runs here and what stays local: docs/dev/testing.md.
#
# Every PR and every push to main starts the run, so the "CI summary" check always
# reports and a ruleset can require it. A docs-only change skips the macOS jobs:
# the `changes` job decides, and the summary counts a skipped job as passing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel a superseded PR run, never a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Owners, the PR shape gate's tests, then the docs filter. The diff is HEAD^1..HEAD: the PR merge commit
  # against main, or the squash commit on main. A manual run, or a commit with
  # no parent, runs everything.
  changes:
    name: Owners and changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Every script and workflow has an owner
        run: bash scripts/check-owners.sh

      # The PR's copy of the PR shape gate passes its tests before it becomes
      # the base copy. Here, not in pr-shape.yml: that job runs no PR code.
      - name: The PR shape gate passes its tests
        run: bash scripts/pr-shape-test.sh

      # Docs-only paths. README.md is NOT one: the MCP test reads it.
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=false
          if [ "$EVENT" = workflow_dispatch ] || ! files="$(git diff --name-only HEAD^1 HEAD)"; then
            code=true
          else
            while IFS= read -r f; do
              case "$f" in
              "" | docs/* | site/* | AGENTS.md | CLAUDE.md | CONTRIBUTING.md | LICENSE | .github/ISSUE_TEMPLATE/* | .github/pull_request_template.md) ;;
              *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Tests (smoke suite and unit tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Explicit image, never *-latest.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pandoc drives the `spacedown docx` checks, entr the --watch check. The image
      # already has node, python3 and Google Chrome (the headless browser checks).
      - name: Install test tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install pandoc entr

      - name: Tool versions
        run: |
          sw_vers -productVersion
          node --version
          python3 --version
          pandoc --version | head -1

      # Stock /bin/bash (3.2) on purpose: it is what a fresh Mac runs. A parse error
      # under 3.2 once ended the suite early with exit 0, so the step also requires
      # the summary line that only a complete run prints.
      - name: Smoke suite
        run: |
          set -o pipefail
          for f in tests/*.sh; do /bin/bash -n "$f"; done
          /bin/bash tests/smoke.sh | tee "$RUNNER_TEMP/smoke.log"
          grep -Eq '^smoke: all [0-9]+ passed$' "$RUNNER_TEMP/smoke.log"

      - name: Unit tests outside the smoke suite
        run: |
          /bin/bash tests/katex-one-test.sh
          /bin/bash tests/size-budget-test.sh
          /bin/bash tests/release-notes-test.sh
          node tests/hljs-bundle-test.js

  build:
    name: Build the app (unsigned, not installed)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          newest=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -E '/Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?\.app$' | sort -V | tail -1)
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      # NO_INSTALL=1 stops after the ad hoc signature: nothing is installed,
      # registered or launched.
      - name: Build
        env:
          NO_INSTALL: "1"
        run: integrations/build-safari.sh --with-safari

  # The release build is universal, but every other job runs on Apple silicon. This one
  # builds on a GitHub-hosted Intel runner (free on a public repo), checks every Mach-O
  # carries both slices, renders through the bundled CLI under `arch -x86_64`, then runs
  # the smoke suite there. `macos-26-intel` is the Intel label of the macos-26 image.
  intel:
    name: Intel Mac (x86_64 slice)
    needs: changes
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe
        run: |
          set +e
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          T="$RUNNER_TEMP/p"; mkdir -p "$T"
          cat > "$T/srv.py" <<'PY'
          import http.server, struct, sys, zlib
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          rows = b"".join(b"\x00" + b"\xff\x00\x00" * 200 for _ in range(100))
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 200, 100, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b"")
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  print("GET", self.path, flush=True)
                  self.send_response(200); self.send_header("Content-Type", "image/png"); self.send_header("Content-Length", str(len(png))); self.end_headers(); self.wfile.write(png)
              def log_message(self, *a): pass
          srv = http.server.HTTPServer(("127.0.0.1", 0), H)
          open(sys.argv[1], "w").write(str(srv.server_port))
          srv.serve_forever()
          PY
          python3 -I "$T/srv.py" "$T/port" > "$T/srv.log" 2>&1 &
          for _ in $(seq 1 20); do [ -s "$T/port" ] && break; sleep 0.25; done
          echo "port=$(cat "$T/port")"
          printf '# Remote\n\n![remote](http://localhost:%s/red.png)\n' "$(cat "$T/port")" > "$T/r.md"
          bin/spacedown "$T/r.md" --out "$T/r.html" --shot "$T/on.png"; echo on=$?
          cat "$T/srv.log"
          bin/spacedown "$T/r.md" --out "$T/r.html" --shot "$T/off.png" --offline; echo off=$?
          cat "$T/srv.log"
          ls -l "$T"/*.png; shasum "$T"/*.png
          sleep 1; sed -i '' 's#localhost#127.0.0.1#' "$T/r.md"
          bin/spacedown "$T/r.md" --out "$T/r2.html" --shot "$T/on2.png"; echo on2=$?
          bin/spacedown "$T/r.md" --out "$T/r2.html" --shot "$T/off2.png" --offline; echo off2=$?
          shasum "$T"/*2.png
          cat "$T/srv.log"

  actionlint:
    name: Lint workflows
    # Public repo: a hosted Linux runner is free.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # The one CI check a ruleset requires. It always runs and fails when the
  # filter failed or any job failed or was cancelled; a skipped job (a docs-only
  # change) passes. Without always() a red test would skip this job, and a
  # skipped required check counts as passing.
  summary:
    name: CI summary
    if: always()
    needs: [changes, test, build, actionlint]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
        run: |
          echo "changes=$CHANGES test=$TEST build=$BUILD actionlint=$ACTIONLINT"
          [ "$CHANGES" = success ] || { echo "the owners and paths job did not succeed"; exit 1; }
          for r in "$TEST" "$BUILD" "$ACTIONLINT"; do
            case "$r" in
            success | skipped) ;;
            *) echo "a CI job ended $r"; exit 1 ;;
            esac
          done
          echo "CI summary: pass"
